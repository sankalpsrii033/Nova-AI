// ===================== UTILITIES =====================
const uid = () => Math.random().toString(36).slice(2, 10);
const now = () => Date.now();
const hash = (s) => {
  let h = 0;
  const str = String(s || "");
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return String(h);
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const SENSITIVE = [/\.env($|\.)/i, /\.pem$/i, /\.key$/i, /credentials/i, /secret/i, /service.?account/i];
const isSensitive = (p) => SENSITIVE.some((re) => re.test(p || ""));
const normalizePath = (p) => String(p || "").replace(/\\/g, "/").replace(/^\.\//, "").replace(/\/+/g, "/");
const isSafePath = (p) => {
  const n = normalizePath(p);
  if (!n || n.startsWith("/") || n.includes("..")) return false;
  return true;
};

const extLang = (path) => {
  const e = (path || "").split(".").pop()?.toLowerCase();

};

function buildTree(files) {
  const root = { name: "NOVA-DEMO", path: "", type: "dir", children: [] };
  const ensure = (parts) => {
    let node = root;
    let path = "";
    for (const part of parts) {
      path = path ? path + "/" + part : part;
      let child = (node.children || []).find((c) => c.name === part);
      if (!child) {
        child = { name: part, path, type: "dir", children: [] };
        node.children = node.children || [];
        node.children.push(child);
      }
      node = child;
    }
    return node;
  };
  Object.keys(files).sort().forEach((p) => {
    const parts = p.split("/");
    const name = parts.pop();
    const parent = parts.length ? ensure(parts) : root;
    parent.children = parent.children || [];
    parent.children.push({ name, path: p, type: "file" });
  });
  const sortNode = (n) => {
    if (n.children) {
      n.children.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === "dir" ? -1 : 1));
      n.children.forEach(sortNode);
    }
  };
  sortNode(root);
  return root;
}

// ===================== WORKSPACE =====================
class DemoFS {
  constructor() {
    this.name = "NOVA-DEMO";
    this.files = { ...DEMO_FILES };
    try {
      const saved = localStorage.getItem("nova-demo-fs");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object") this.files = parsed;
      }
    } catch (e) {
      console.warn("[NOVA] DemoFS localStorage reset", e);
      try { localStorage.removeItem("nova-demo-fs"); } catch {}
    }
  }
  persist() {
    try { localStorage.setItem("nova-demo-fs", JSON.stringify(this.files)); } catch {}
    try {
      const pid = window.__NOVA_PROJECT_ID__;
      if (pid) {
        const prev = loadProjectData(pid) || {};
        prev.files = this.files;
        prev.updatedAt = Date.now();
        saveProjectData(pid, prev);
      }
    } catch {}
  }
  listTree() { return buildTree(this.files); }
  async readFile(path) {
    path = normalizePath(path);
    if (!(path in this.files)) throw new Error("File not found: " + path);
    return this.files[path];
  }
  async writeFile(path, content) {
    path = normalizePath(path);
    if (!isSafePath(path)) throw new Error("Invalid path");
    this.files[path] = content;
    this.persist();
  }
  async createFile(path, content = "") {
    path = normalizePath(path);
    if (!isSafePath(path)) throw new Error("Invalid path");
    if (path in this.files) throw new Error("File already exists");
    this.files[path] = content;
    this.persist();
  }
  async deleteFile(path) {
    path = normalizePath(path);
    if (!(path in this.files)) throw new Error("File not found");
    delete this.files[path];
    this.persist();
  }
  async rename(oldPath, newPath) {
    oldPath = normalizePath(oldPath); newPath = normalizePath(newPath);
    if (!(oldPath in this.files)) throw new Error("File not found");
    if (newPath in this.files) throw new Error("Target exists");
    this.files[newPath] = this.files[oldPath];
    delete this.files[oldPath];
    this.persist();
  }
  async createDir(path) {
    // virtual dirs via tree; no-op content
    return true;
  }
  searchFiles(q) {
    q = (q || "").toLowerCase();
    return Object.keys(this.files).filter((p) => p.toLowerCase().includes(q));
  }
  searchContent(q) {
    q = String(q || "");
    const out = [];
    for (const [path, content] of Object.entries(this.files)) {
      const lines = String(content).split("\n");
      lines.forEach((line, i) => {
        if (line.includes(q)) out.push({ path, line: i + 1, match: line.trim().slice(0, 120) });
      });
    }
    return out.slice(0, 50);
  }
}

// ===================== EXECUTION (Phase 4 sim) =====================
const BLOCKED_EXE = new Set(["bash", "sh", "zsh", "cmd", "powershell", "pwsh", "sudo", "rm", "chmod", "chown"]);
const SHELL_META = /(&&|\|\||;|\||`|\$\(|>|>>|<)/;

class CommandPolicyManager {
  classify(req) {
    const exe = String(req.executable || "").toLowerCase();
    const args = (req.args || []).map(String);
    const joined = [exe, ...args].join(" ");
    if (BLOCKED_EXE.has(exe) || SHELL_META.test(joined)) return { level: "BLOCKED", reason: "Shell/injection blocked" };
    if (exe === "git") {
      const sub = (args[0] || "").toLowerCase();
      if (["reset", "clean"].includes(sub)) {
        if (args.some((a) => a === "--hard" || a === "-fd" || a === "-f"))
          return { level: "BLOCKED", reason: "Destructive git operation blocked" };
      }
      if (["push", "pull", "commit", "add", "checkout", "switch", "branch", "init", "merge", "rebase", "revert"].includes(sub))
        return { level: "APPROVAL_REQUIRED", reason: "Git state change requires approval" };
      return { level: "ALLOWED", reason: "Read-only git" };
    }
    if (["node", "npm", "pnpm", "yarn", "bun"].includes(exe)) {
      if (args[0] === "--version" || args[0] === "-v" || (args[0] === "run" && ["build","test","lint","dev"].includes(args[1])) || args[0] === "install")
        return args[0] === "--version" || args[0] === "-v" ? { level: "ALLOWED", reason: "Version check" } : { level: "APPROVAL_REQUIRED", reason: "Project command" };
    }
    return { level: "BLOCKED", reason: "Unknown command" };
  }
}

class SimulatedSandbox {
  constructor() { this.running = new Map(); }
  async execute(req, onOutput) {
    const id = req.id || uid();
    const startedAt = now();
    const controller = { aborted: false };
    this.running.set(id, controller);
    const emit = (stream, text) => onOutput && onOutput({ stream, text, id });
    try {
      await sleep(200);
      if (controller.aborted) throw new Error("Aborted");
      const exe = req.executable;
      const args = req.args || [];
      if (exe === "git") return await this.simGit(args, emit, controller, req);
      if (exe === "node" && (args[0] === "-v" || args[0] === "--version")) {
        emit("stdout", "v20.11.0\n");
        return this.ok(id, req, startedAt, 0);
      }
      if (["npm","pnpm","yarn","bun"].includes(exe) && (args[0] === "-v" || args[0] === "--version")) {
        emit("stdout", "10.2.0\n");
        return this.ok(id, req, startedAt, 0);
      }
      if (args[0] === "run" && args[1] === "build") {
        emit("stdout", "vite v5.4.0 building for production...\ntransforming...\n✓ 12 modules transformed.\n");
        await sleep(400);
        // simulate fail if file has intentional error marker
        const fs = window.__NOVA_FS__;
        let fail = false;
        if (fs) {
          for (const c of Object.values(fs.files)) {
            if (String(c).includes('const count: string = 10')) fail = true;
          }
        }
        if (fail) {
          emit("stderr", "src/App.tsx:5:7 - error TS2322: Type 'number' is not assignable to type 'string'.\n");
          return this.ok(id, req, startedAt, 1);
        }
        emit("stdout", "✓ built in 412ms\n");
        return this.ok(id, req, startedAt, 0);
      }
      if (args[0] === "run" && args[1] === "test") {
        emit("stdout", "✓ test/app.test.ts (3)\n");
        return this.ok(id, req, startedAt, 0);
      }
      if (args[0] === "run" && args[1] === "lint") {
        emit("stdout", "✓ No ESLint warnings\n");
        return this.ok(id, req, startedAt, 0);
      }
      if (args[0] === "run" && args[1] === "dev") {
        emit("stdout", "VITE v5.4.0  ready in 220 ms\n➜  Local:   http://localhost:5173/\n");
        return this.ok(id, req, startedAt, 0);
      }
      if (args[0] === "install") {
        emit("stdout", "added 42 packages in 1.2s\n");
        return this.ok(id, req, startedAt, 0);
      }
      emit("stderr", "Command not simulated: " + exe + " " + args.join(" ") + "\n");
      return this.ok(id, req, startedAt, 1);
    } finally {
      this.running.delete(id);
    }
  }
  async simGit(args, emit, controller, req) {
    const git = window.__NOVA_GIT__;
    if (!git) {
      emit("stderr", "Git service unavailable\n");
      return this.ok(req.id, req, now(), 1);
    }
    const result = await git.handleCli(args, emit);
    return {
      id: req.id,
      success: result.exitCode === 0,
      exitCode: result.exitCode,
      stdout: result.stdout || "",
      stderr: result.stderr || "",
      duration: 50,
      timedOut: false,
      command: "git " + args.join(" "),
      startedAt: now(),
      finishedAt: now(),
    };
  }
  ok(id, req, startedAt, code) {
    return {
      id, success: code === 0, exitCode: code, stdout: "", stderr: "",
      duration: now() - startedAt, timedOut: false,
      command: req.executable + " " + (req.args || []).join(" "),
      startedAt, finishedAt: now(),
    };
  }
  stop(id) {
    const c = this.running.get(id);
    if (c) c.aborted = true;
  }
  stopAll() { for (const id of this.running.keys()) this.stop(id); }
}

class ExecutionManager {
  constructor() {
    this.policy = new CommandPolicyManager();
    this.sandbox = new SimulatedSandbox();
    this.history = [];
    this.listeners = new Set();
    this.sandboxed = false; // honesty: local simulation
    this.mode = "LOCAL";
  }
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit(evt) { this.listeners.forEach((fn) => { try { fn(evt); } catch {} }); }
  async execute(req, { skipApprovalCheck } = {}) {
    const id = req.id || uid();
    req = { ...req, id, createdAt: now() };
    const policy = this.policy.classify(req);
    req.policyResult = policy;
    if (policy.level === "BLOCKED") {
      const result = { id, success: false, exitCode: 126, stdout: "", stderr: policy.reason, duration: 0, timedOut: false, command: req.executable, blocked: true };
      this.history.unshift(result);
      this.emit({ type: "ExecutionCompleted", result });
      return result;
    }
    if (policy.level === "APPROVAL_REQUIRED" && !skipApprovalCheck && !req.approved) {
      return { id, success: false, exitCode: -1, needsApproval: true, request: req, policy };
    }
    this.emit({ type: "ExecutionStarted", request: req });
    let stdout = "", stderr = "";
    const result = await this.sandbox.execute(req, ({ stream, text }) => {
      if (stream === "stdout") stdout += text; else stderr += text;
      this.emit({ type: "ExecutionOutput", id, stream, text });
    });
    result.stdout = result.stdout || stdout;
    result.stderr = result.stderr || stderr;
    this.history.unshift(result);
    this.emit({ type: "ExecutionCompleted", result });
    return result;
  }
  stopAll() { this.sandbox.stopAll(); }
}

const executionManager = new ExecutionManager();

// ===================== GIT ENGINE (Phase 5 — simulated) =====================
/**
 * Honesty: This is a LOCAL SIMULATED Git repository.
 * Real git CLI is not available in the browser. Architecture routes through
 * ExecutionManager so a future desktop/WebContainer provider can swap in.
 */
class GitRepository {
  constructor(fs) {
    this.fs = fs;
    this.initialized = false;
    this.branch = "main";
    this.branches = ["main"];
    this.head = null;
    this.commits = []; // { hash, message, author, date, parents, tree }
    this.staged = new Map(); // path -> content snapshot
    this.remotes = {}; // name -> url
    this.upstream = {}; // branch -> { remote, name, ahead, behind }
    this.detached = false;
    this.load();
  }
  storageKey() { return "nova-git-state-v1"; }
  load() {
    try {
      const raw = localStorage.getItem(this.storageKey());
      if (!raw) return;
      const s = JSON.parse(raw);
      Object.assign(this, {
        initialized: s.initialized, branch: s.branch, branches: s.branches,
        head: s.head, commits: s.commits, remotes: s.remotes || {},
        upstream: s.upstream || {}, detached: !!s.detached,
      });
      this.staged = new Map(s.staged || []);
    } catch {}
  }
  save() {
    localStorage.setItem(this.storageKey(), JSON.stringify({
      initialized: this.initialized, branch: this.branch, branches: this.branches,
      head: this.head, commits: this.commits, remotes: this.remotes,
      upstream: this.upstream, detached: this.detached,
      staged: [...this.staged.entries()],
    }));
  }
  blobHash(content) { return "b" + hash(content).replace("-", "n"); }
  commitHash(msg, tree, parents) {
    return hash(msg + tree + (parents || []).join() + now()).replace("-", "c").slice(0, 7);
  }
  headTree() {
    if (!this.head) return {};
    const c = this.commits.find((x) => x.hash === this.head);
    return c ? { ...c.tree } : {};
  }
  workingTree() {
    return { ...this.fs.files };
  }
  status() {
    if (!this.initialized) {
      return { initialized: false, branch: null, files: [], staged: [], conflicted: [], ahead: 0, behind: 0, detached: false };
    }
    const head = this.headTree();
    const work = this.workingTree();
    const files = [];
    const allPaths = new Set([...Object.keys(head), ...Object.keys(work), ...this.staged.keys()]);
    for (const p of allPaths) {
      if (p.startsWith(".git")) continue;
      const inHead = p in head;
      const inWork = p in work;
      const inStage = this.staged.has(p);
      const headC = head[p];
      const workC = work[p];
      const stageC = inStage ? this.staged.get(p) : undefined;
      let status = null;
      if (inStage) {
        if (!inHead) status = "A";
        else if (stageC !== headC) status = "M";
        else if (!inWork) status = "D";
      }
      let wt = null;
      if (!inWork && inHead) wt = "D";
      else if (inWork && !inHead && !inStage) wt = "U";
      else if (inWork && inHead && workC !== headC && (!inStage || workC !== stageC)) wt = "M";
      else if (inWork && !inHead && inStage && workC !== stageC) wt = "M";
      if (status || wt) files.push({ path: p, index: status, worktree: wt, sensitive: isSensitive(p) });
    }
    files.sort((a, b) => a.path.localeCompare(b.path));
    const staged = files.filter((f) => f.index);
    const up = this.upstream[this.branch] || { ahead: 0, behind: 0 };
    return {
      initialized: true,
      branch: this.branch,
      detached: this.detached,
      files,
      staged,
      unstaged: files.filter((f) => f.worktree),
      conflicted: [],
      ahead: up.ahead || 0,
      behind: up.behind || 0,
      remotes: { ...this.remotes },
      head: this.head,
    };
  }
  init() {
    if (this.initialized) return { ok: true, message: "Already a git repository" };
    this.initialized = true;
    this.branch = "main";
    this.branches = ["main"];
    this.commits = [];
    this.head = null;
    this.staged = new Map();
    // initial commit of current tree
    const tree = { ...this.workingTree() };
    // don't auto-commit .env
    Object.keys(tree).forEach((p) => { if (isSensitive(p)) delete tree[p]; });
    const ch = this.commitHash("Initial commit", JSON.stringify(tree), []);
    this.commits.push({
      hash: ch, message: "Initial commit", author: "NOVA <nova@local>",
      date: new Date().toISOString(), parents: [], tree,
    });
    this.head = ch;
    this.save();
    return { ok: true, message: "Initialized empty Git repository (simulated)" };
  }
  stage(paths) {
    const st = this.status();
    if (!st.initialized) throw new Error("Not a git repository");
    const work = this.workingTree();
    const head = this.headTree();
    const warnings = [];
    for (const p of paths) {
      const path = normalizePath(p);
      if (isSensitive(path)) {
        warnings.push(path);
        continue;
      }
      if (path in work) this.staged.set(path, work[path]);
      else if (path in head) this.staged.set(path, null); // deletion
    }
    this.save();
    return { ok: true, warnings };
  }
  stageAll() {
    const st = this.status();
    const paths = st.files.filter((f) => f.worktree || f.index).map((f) => f.path);
    return this.stage(paths);
  }
  unstage(paths) {
    for (const p of paths) this.staged.delete(normalizePath(p));
    this.save();
    return { ok: true };
  }
  unstageAll() {
    this.staged.clear();
    this.save();
    return { ok: true };
  }
  commit(message, author = "NOVA <nova@local>") {
    if (!message || !String(message).trim()) throw new Error("Commit message required");
    if (this.staged.size === 0) throw new Error("No staged changes to commit");
    const tree = { ...this.headTree() };
    for (const [p, content] of this.staged.entries()) {
      if (content === null) delete tree[p];
      else tree[p] = content;
    }
    const ch = this.commitHash(message, JSON.stringify(tree), this.head ? [this.head] : []);
    this.commits.unshift({
      hash: ch, message: String(message).trim(), author, date: new Date().toISOString(),
      parents: this.head ? [this.head] : [], tree,
    });
    this.head = ch;
    this.staged.clear();
    // bump ahead
    const up = this.upstream[this.branch] || { remote: "origin", name: this.branch, ahead: 0, behind: 0 };
    up.ahead = (up.ahead || 0) + 1;
    this.upstream[this.branch] = up;
    this.save();
    return { ok: true, hash: ch, message };
  }
  log(limit = 20) {
    return this.commits.slice(0, limit).map((c) => ({
      hash: c.hash, message: c.message, author: c.author, date: c.date, parents: c.parents,
    }));
  }
  diff(path) {
    const head = this.headTree();
    const work = this.workingTree();
    const a = path in this.staged ? (this.staged.get(path) ?? "") : (head[path] ?? "");
    const b = work[path] ?? (this.staged.has(path) && this.staged.get(path) === null ? "" : work[path] ?? "");
    // if staged vs head for staged diff
    const oldC = head[path] ?? "";
    const newC = this.staged.has(path) ? (this.staged.get(path) ?? "") : (work[path] ?? "");
    return lineDiff(oldC, newC === null ? "" : newC);
  }
  createBranch(name) {
    if (!/^[a-zA-Z0-9._\-\/]+$/.test(name) || name.length > 64) throw new Error("Invalid branch name");
    if (this.branches.includes(name)) throw new Error("Branch already exists");
    this.branches.push(name);
    this.save();
    return { ok: true, name };
  }
  switchBranch(name, { force } = {}) {
    if (!this.branches.includes(name)) throw new Error("Branch not found");
    const st = this.status();
    if (!force && (st.unstaged.length || st.staged.length)) {
      return { ok: false, needsConfirm: true, message: "Uncommitted changes present" };
    }
    this.branch = name;
    this.detached = false;
    this.save();
    return { ok: true, branch: name };
  }
  setRemote(name, url) {
    this.remotes[name] = url;
    this.save();
  }
  async handleCli(args, emit) {
    let stdout = "", stderr = "";
    const out = (t) => { stdout += t; emit && emit("stdout", t); };
    const err = (t) => { stderr += t; emit && emit("stderr", t); };
    try {
      const sub = (args[0] || "").toLowerCase();
      if (sub === "--version" || sub === "version") {
        out("git version 2.43.0 (simulated)\n");
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "init") {
        const r = this.init();
        out(r.message + "\n");
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "status") {
        const st = this.status();
        if (!st.initialized) { err("fatal: not a git repository\n"); return { exitCode: 128, stdout, stderr }; }
        out("On branch " + st.branch + "\n");
        if (st.staged.length) {
          out("\nChanges to be committed:\n");
          st.staged.forEach((f) => out("  " + (f.index || " ") + "  " + f.path + "\n"));
        }
        if (st.unstaged.length) {
          out("\nChanges not staged for commit:\n");
          st.unstaged.forEach((f) => out("  " + (f.worktree || " ") + "  " + f.path + "\n"));
        }
        if (!st.staged.length && !st.unstaged.length) out("\nnothing to commit, working tree clean\n");
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "add") {
        const paths = args.slice(1).filter((a) => !a.startsWith("-"));
        if (paths.includes(".") || paths.includes("-A") || args.includes("-A")) {
          const r = this.stageAll();
          if (r.warnings?.length) err("warning: skipped sensitive: " + r.warnings.join(", ") + "\n");
        } else {
          const r = this.stage(paths);
          if (r.warnings?.length) err("warning: skipped sensitive: " + r.warnings.join(", ") + "\n");
        }
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "commit") {
        const mi = args.indexOf("-m");
        const msg = mi >= 0 ? args[mi + 1] : "";
        const r = this.commit(msg);
        out("[" + this.branch + " " + r.hash + "] " + r.message + "\n");
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "log") {
        this.log(10).forEach((c) => {
          out("commit " + c.hash + "\nAuthor: " + c.author + "\nDate:   " + c.date + "\n\n    " + c.message + "\n\n");
        });
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "branch") {
        if (args[1] && !args[1].startsWith("-")) {
          this.createBranch(args[1]);
          return { exitCode: 0, stdout, stderr };
        }
        this.branches.forEach((b) => out((b === this.branch ? "* " : "  ") + b + "\n"));
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "checkout" || sub === "switch") {
        const name = args.find((a, i) => i > 0 && !a.startsWith("-"));
        const r = this.switchBranch(name);
        if (r.needsConfirm) { err(r.message + "\n"); return { exitCode: 1, stdout, stderr }; }
        out("Switched to branch '" + name + "'\n");
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "diff") {
        const st = this.status();
        st.files.forEach((f) => {
          const d = this.diff(f.path);
          if (d.length) {
            out("diff --git a/" + f.path + " b/" + f.path + "\n");
            d.forEach((line) => out(line.text + "\n"));
          }
        });
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "remote") {
        if (args[1] === "-v") {
          Object.entries(this.remotes).forEach(([n, u]) => out(n + "\t" + u + " (fetch)\n" + n + "\t" + u + " (push)\n"));
        } else if (args[1] === "add") {
          this.setRemote(args[2], args[3]);
        } else {
          Object.keys(this.remotes).forEach((n) => out(n + "\n"));
        }
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "push") {
        if (!this.remotes.origin) { err("fatal: no remote configured\n"); return { exitCode: 1, stdout, stderr }; }
        const up = this.upstream[this.branch] || { ahead: 0, behind: 0 };
        if (up.behind > 0) { err("error: failed to push some refs (non-fast-forward)\n"); return { exitCode: 1, stdout, stderr }; }
        out("To " + this.remotes.origin + "\n");
        out("   " + (this.head || "000") + ".. " + this.branch + " -> " + this.branch + "\n");
        up.ahead = 0;
        this.upstream[this.branch] = up;
        this.save();
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "pull" || sub === "fetch") {
        if (!this.remotes.origin) { err("fatal: no remote configured\n"); return { exitCode: 1, stdout, stderr }; }
        out("From " + this.remotes.origin + "\n * branch            main       -> FETCH_HEAD\n");
        if (sub === "pull") {
          const st = this.status();
          if (st.unstaged.length || st.staged.length) {
            err("error: cannot pull with uncommitted changes\n");
            return { exitCode: 1, stdout, stderr };
          }
        }
        return { exitCode: 0, stdout, stderr };
      }
      if (sub === "rev-parse") {
        if (args.includes("--is-inside-work-tree")) { out("true\n"); return { exitCode: 0, stdout, stderr }; }
        if (args.includes("--show-toplevel")) { out("/workspace/NOVA-DEMO\n"); return { exitCode: 0, stdout, stderr }; }
        if (args.includes("HEAD")) { out((this.head || "") + "\n"); return { exitCode: 0, stdout, stderr }; }
      }
      err("git: '" + sub + "' simulation not implemented\n");
      return { exitCode: 1, stdout, stderr };
    } catch (e) {
      err(String(e.message || e) + "\n");
      return { exitCode: 1, stdout, stderr };
    }
  }
}

function lineDiff(oldText, newText) {
  const a = String(oldText || "").split("\n");
  const b = String(newText || "").split("\n");
  const out = [];
  const max = Math.max(a.length, b.length);
  for (let i = 0; i < max; i++) {
    if (a[i] === b[i]) {
      if (a[i] !== undefined) out.push({ type: "ctx", text: "  " + a[i] });
    } else {
      if (a[i] !== undefined) out.push({ type: "del", text: "- " + a[i] });
      if (b[i] !== undefined) out.push({ type: "add", text: "+ " + b[i] });
    }
  }
  return out.slice(0, 200);
}

const ProviderHealth = {
  providers: {
    primary: { id: "primary", healthy: true, failureCount: 0, lastFailure: 0, cooldownUntil: 0, lastSuccess: 0, failureReason: "" },

  },
  isAvailable(id) {
    const p = this.providers[id];
    if (!p) return false;
    if (p.cooldownUntil && Date.now() < p.cooldownUntil) return false;
    return true;
  },
  markSuccess(id) {
    const p = this.providers[id];
    if (!p) return;
    p.healthy = true;
    p.failureCount = 0;
    p.failureReason = "";
    p.cooldownUntil = 0;
    p.lastSuccess = Date.now();
  },
  markFailure(id, reason, cooldownMs) {
    const p = this.providers[id];
    if (!p) return;
    p.healthy = false;
    p.failureCount = (p.failureCount || 0) + 1;
    p.lastFailure = Date.now();
    p.failureReason = reason || "UNKNOWN";
    const cd = Number(cooldownMs) || 900000;
    // Quota / rate-limit → longer cooldown; transient → shorter
    if (reason === "QUOTA_EXHAUSTED" || reason === "RATE_LIMITED") {
      p.cooldownUntil = Date.now() + cd;
    } else if (reason === "PROVIDER_UNAVAILABLE" || reason === "NETWORK_ERROR" || reason === "AUTH_FAILED") {
      p.cooldownUntil = Date.now() + Math.min(cd, 120000);
    } else {
      p.cooldownUntil = Date.now() + 30000;
    }
  },

function classifyProviderError(status, message) {
  const msg = String(message || "").toLowerCase();
  const s = Number(status) || 0;
  if (s === 429 || /rate.?limit|too many requests|throttl/.test(msg)) return "RATE_LIMITED";
  if (/quota|credit|billing|insufficient|usage.?limit|monthly.?limit|limit.?exceeded|exceeded.*limit|out of credits|balance/.test(msg)) return "QUOTA_EXHAUSTED";
  if (s === 401 || s === 403 || /unauthorized|forbidden|invalid.?api.?key|authentication|expired.?session|invalid.?session|token.?expired/.test(msg)) return "AUTH_FAILED";
  if (s === 404 || /model.?not.?found|unknown.?model|does not exist|no such model/.test(msg)) return "MODEL_UNAVAILABLE";
  if (s === 400 || /invalid.?request|bad.?request|malformed|validation/.test(msg)) return "INVALID_REQUEST";
  if (s === 502 || s === 503 || s === 504 || /unavailable|bad gateway|overloaded|upstream|service.?unavailable|temporarily/.test(msg)) return "PROVIDER_UNAVAILABLE";
  if (/network|failed to fetch|cors|econnrefused|timeout|timed out/.test(msg)) return "NETWORK_ERROR";
  if (s >= 500) return "PROVIDER_UNAVAILABLE";
  return "UNKNOWN";
}

function shouldFallback(classification, strategy) {
  if (strategy === "primary_only") return false;
  if (strategy === "manual") return false;
  return (
    classification === "QUOTA_EXHAUSTED" ||
    classification === "RATE_LIMITED" ||
    classification === "PROVIDER_UNAVAILABLE" ||
    classification === "NETWORK_ERROR" ||
    classification === "AUTH_FAILED" ||
    classification === "MODEL_UNAVAILABLE"
  );
}

// ---- File blocks from model + chat history ----
function parseFileBlocks(text) {
  const files = [];
  const raw = String(text || "");
  const re = /@@@FILE:([^\n]+)\n([\s\S]*?)@@@END/g;
  let m;
  while ((m = re.exec(raw))) {
    const path = normalizePath(m[1].trim());
    const content = m[2].replace(/^\n/, "").replace(/\n$/, "");
    if (path && isSafePath(path)) files.push({ path, content });
  }
  const re3 = /```[\w+-]*:([^\n]+)\n([\s\S]*?)```/g;
  while ((m = re3.exec(raw))) {
    const path = normalizePath(m[1].trim());
    if (path && isSafePath(path) && path.includes(".")) {
      files.push({ path, content: m[2].replace(/\n$/, "") });
    }
  }
  const map = new Map();
  files.forEach((f) => map.set(f.path, f));
  return [...map.values()];
}

/** Extract content for a single expected path from model text (robust). */
function extractFileContent(text, expectedPath) {
  const raw0 = String(text || "");
  let raw = raw0.trim();
  if (!raw) return null;
  const expected = (typeof normalizePath === "function" ? normalizePath(expectedPath || "") : String(expectedPath || "").replace(/^\/+/, "")) || "index.html";
  const expBase = expected.split("/").pop();

  // 1) Explicit path blocks via parseFileBlocks
  try {
    const blocks = parseFileBlocks(raw);
    if (blocks && blocks.length) {
      const match =
        blocks.find((b) => b.path === expected) ||
        blocks.find((b) => (b.path || "").split("/").pop() === expBase) ||
        blocks[0];
      if (match && match.content && match.content.trim().length > 5) return match.content.trim();
    }
  } catch (e) {}

  // 2) Unclosed @@@FILE:path
  const openFile = raw.match(/@@@FILE:\s*([^\n]+)\n([\s\S]*)$/i);
  if (openFile && openFile[2] && openFile[2].trim().length > 5) {
    const body = openFile[2].replace(/\n?@@@END\s*$/i, "").trim();
    if (body.length > 5) return body;
  }

  // 3) Closed fences ```lang or ```lang:path
  const fenceRe = /```(?:([\w+-]*)(?::([^\n]+))?)?[ \t]*\n([\s\S]*?)```/g;
  let best = null;
  let m;
  while ((m = fenceRe.exec(raw)) !== null) {
    const lang = (m[1] || "").toLowerCase();
    const pathLabel = (m[2] || "").trim();
    const body = (m[3] || "").trim();
    if (body.length < 6) continue;
    const score =
      (pathLabel && (pathLabel === expected || pathLabel.endsWith(expBase)) ? 1000 : 0) +
      ((lang === "html" || lang === "htm") ? 100 : 0) +
      Math.min(body.length, 5000);
    if (!best || score > best.score) best = { body: body, score: score };
  }
  if (best) return best.body;

  // 4) Unclosed fence to EOF
  const unclosed = raw.match(/```(?:html|htm|tsx?|jsx?|css|json|xml|txt|markdown|md)?(?::[^\n]*)?[ \t]*\n([\s\S]+)$/i);
  if (unclosed && unclosed[1] && unclosed[1].trim().length > 10) {
    const body = unclosed[1].replace(/\n```\s*$/, "").trim();
    if (body.length > 10) return body;
  }

  // 5) Raw HTML document
  if (/<!DOCTYPE\s+html/i.test(raw) || /<html[\s>]/i.test(raw)) {
    const startHtml = raw.search(/<!DOCTYPE\s+html|<html[\s>]/i);
    if (startHtml >= 0) {
      let doc = raw.slice(startHtml);
      const endHtml = doc.toLowerCase().lastIndexOf("</html>");
      if (endHtml >= 0) doc = doc.slice(0, endHtml + 7);
      if (doc.trim().length > 20) return doc.trim();
    }
  }

  // 6) Strip leading prose until code-looking line
  const lines = raw.split(/\r?\n/);
  let codeStart = -1;
  for (let li = 0; li < lines.length; li++) {
    const L = lines[li].trim();
    if (
      /^<!DOCTYPE/i.test(L) ||
      /^<html[\s>]/i.test(L) ||
      /^import\s+/i.test(L) ||
      /^export\s+/i.test(L) ||
      /^const\s+/i.test(L) ||
      /^function\s+/i.test(L) ||
      /^\{/.test(L) ||
      /^\/\//.test(L)
    ) {
      codeStart = li;
      break;
    }
  }
  if (codeStart >= 0) {
    const body = lines.slice(codeStart).join("\n").replace(/\n```\s*$/, "").trim();
    if (body.length > 20) return body;
  }

  // 7) Last resort
  const stripped = raw.replace(/^```[\w+:-]*[ \t]*\n?/, "").replace(/\n?```\s*$/, "").trim();
  if (
    stripped.length > 40 &&
    !/^error:/i.test(stripped) &&
    !/^I('m| am) (sorry|unable)/i.test(stripped)
  ) {
    if (
      /<\/?[a-z][\s\S]*>/i.test(stripped) ||
      /[{};=]/.test(stripped) ||
      /\.(md|txt|json)$/i.test(expected)
    ) {
      return stripped;
    }
  }
  return null;
}


function stripFileBlocks(text) {

function mimeForFilename(filename) {
  const name = String(filename || "").toLowerCase();
  const ext = name.includes(".") ? name.split(".").pop() : "";
  const map = {
    html: "text/html;charset=utf-8",
    htm: "text/html;charset=utf-8",
    css: "text/css;charset=utf-8",
    js: "text/javascript;charset=utf-8",
    mjs: "text/javascript;charset=utf-8",
    ts: "text/plain;charset=utf-8",
    tsx: "text/plain;charset=utf-8",
    jsx: "text/plain;charset=utf-8",
    json: "application/json;charset=utf-8",
    md: "text/markdown;charset=utf-8",
    markdown: "text/markdown;charset=utf-8",
    txt: "text/plain;charset=utf-8",
    svg: "image/svg+xml;charset=utf-8",

    zip: "application/zip",

    gif: "image/gif",
    webp: "image/webp",
    pdf: "application/pdf",
    py: "text/x-python;charset=utf-8",
  };
  return map[ext] || "application/octet-stream";
}

/**
 * Android Chrome-friendly download:
 * - correct filename + extension
 * - explicit MIME
 * - File() when available (better Share/Download integration)
 * - keep object URL alive long enough for the download to finish
 */
function downloadBlob(filename, blob) {
  const safeName = safeDownloadName(filename);
  const type = (blob && blob.type) || mimeForFilename(safeName);
  let payload = blob;
  try {
    if (!(blob instanceof File)) {
      payload = new File([blob], safeName, { type: type || "application/octet-stream" });
    }
  } catch {
    payload = blob instanceof Blob ? blob : new Blob([blob], { type: type || "application/octet-stream" });
  }

  // Legacy Edge
  if (typeof navigator !== "undefined" && navigator.msSaveOrOpenBlob) {
    try {
      navigator.msSaveOrOpenBlob(payload, safeName);
      return;
    } catch {}
  }

  const url = URL.createObjectURL(payload);
  const a = document.createElement("a");
  a.href = url;
  a.download = safeName;
  a.rel = "noopener";
  a.style.display = "none";
  // Some Android WebViews need the node attached before click
  document.body.appendChild(a);
  // Synchronous click in the same user-gesture stack
  a.click();
  // Revoke only after a long delay so Chrome can finish writing the file
  setTimeout(() => {
    try { a.remove(); } catch {}
    try { URL.revokeObjectURL(url); } catch {}
  }, 60000);
}

function downloadTextFile(filename, content) {
  const safeName = safeDownloadName(filename);
  const type = mimeForFilename(safeName);
  // Use octet-stream as secondary force-download for flaky mobile handlers,
  // but prefer correct type so File Manager shows the right icon/extension.
  const blob = new Blob([content == null ? "" : String(content)], { type: type });
  downloadBlob(safeName, blob);
}

  // Ensure zip MIME
  const zipBlob = blob.type === "application/zip" ? blob : new Blob([blob], { type: "application/zip" });
  downloadBlob(name.endsWith(".zip") ? name : name + ".zip", zipBlob);
}

/**
 * Share a generated file via Web Share API (Android Chrome supports files).
 * Falls back to clear error so UI can show message — Download remains available.
 */
async function shareGeneratedFile(filename, content) {
  const safeName = safeDownloadName(filename);
  const type = mimeForFilename(safeName);
  const blob = content instanceof Blob
    ? content
    : new Blob([content == null ? "" : String(content)], { type });
  let file;
  try {
    file = new File([blob], safeName, { type: blob.type || type });
  } catch {
    throw new Error("Share not supported on this browser. Use Download instead.");
  }

  if (!navigator.share) {
    throw new Error("Share not supported on this device. Use Download instead.");
  }

  // Prefer file share (appears in Android share sheet → Files, Drive, WhatsApp, etc.)
  try {
    if (!navigator.canShare || navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: safeName,
        text: "Shared from NOVA CODE",
      });
      return { mode: "files" };
    }
  } catch (e) {
    // AbortError = user cancelled — not a failure
    if (e && (e.name === "AbortError" || /abort/i.test(String(e.message || "")))) {
      return { mode: "cancelled" };
    }
    // fall through to text share for small text files
  }

  // Text fallback for tiny source files only
  const asText = content instanceof Blob ? null : String(content || "");
  if (asText != null && asText.length > 0 && asText.length < 80000) {
    try {
      await navigator.share({ title: safeName, text: asText });
      return { mode: "text" };
    } catch (e) {
      if (e && (e.name === "AbortError" || /abort/i.test(String(e.message || "")))) {
        return { mode: "cancelled" };
      }
    }
  }

  throw new Error("Share not available for this file. Use Download — file will appear in Downloads.");
}

/** Direct engine fetch. If the browser blocks the upstream host, retry via a transparent relay (not a user setting). */
function isBrowserBlockedError(e) {
  const m = String((e && e.message) || e || "");
  return /failed to fetch|networkerror|load failed|cors|network/i.test(m);
}

function engineUserError(raw) {
  const m = String(raw || "");
  if (/failed to fetch|networkerror|load failed|cors/i.test(m)) {
    return "NOVA Engine could not be reached from this browser. Retrying…";
  }
  if (/overload|upstream error|temporarily/i.test(m)) {
    return "NOVA Engine is busy right now. Retry, or wait a few seconds.";
  }
  if (/nvidia|openrouter|openai|anthropic/i.test(m)) {
    return "NOVA Engine could not complete this request. Try again.";
  }
  return m || "NOVA Engine request failed.";
}

function buildRelayUrls(target, apiKey) {
  const u = String(target || "");
  const auth = apiKey ? "authorization:Bearer " + apiKey : "";
  const qAuth = auth ? "&reqHeaders=" + encodeURIComponent(auth) + "&reqHeaders=" + encodeURIComponent("content-type:application/json") + "&reqHeaders=" + encodeURIComponent("accept:application/json") : "";
  return [
    "https://corsproxy.io/?url=" + encodeURIComponent(u) + qAuth,
    "https://corsproxy.io/?" + encodeURIComponent(u),
  ];
}

async function novaFetch(url, init) {
  const opts = Object.assign({ mode: "cors", credentials: "omit" }, init || {});
  const headers = Object.assign({}, opts.headers || {});
  const apiKey = String((headers.Authorization || headers.authorization || "")).replace(/^Bearer\s+/i, "");

  // 1) Direct
  try {
    const res = await fetch(url, opts);
    if (res.ok || (res.status !== 0 && res.status !== 403)) return res;
    if (res.status === 403) {
      const peek = await res.clone().text().catch(function () { return ""; });
      if (/api key|nvapi|unauthorized|permission|invalid/i.test(peek)) return res;
    }
  } catch (directErr) {
    if (!isBrowserBlockedError(directErr)) throw directErr;
  }

  // 2) Relays — do not send Authorization to the relay host (avoids extra preflight failures).
  //    Auth is passed as corsproxy reqHeaders so the relay attaches it upstream.
  const relayInit = Object.assign({}, opts, {
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json",
    },
  });
  const relays = buildRelayUrls(url, apiKey);
  let lastErr = null;
  for (let i = 0; i < relays.length; i++) {
    try {
      const res = await fetch(relays[i], relayInit);
      if (res.status === 403) {
        const peek = await res.clone().text().catch(function () { return ""; });
        if (/corsproxy|allowed domain|upgrade|cannot proxy|blocked/i.test(peek)) {
          lastErr = new Error("Relay blocked this origin");
          continue;
        }
      }
      return res;
    } catch (e) {
      lastErr = e;
    }
  }
  throw new Error("NOVA Engine is unreachable from this page. Try again in a moment.");
}

class AIClient {
  constructor() {
    this.controller = null;
    this.debug = true;

  log(...args) {

  validateConfig(cfg = this.getConfig()) {
    const active = resolveActiveEngineConfig(cfg);
    const errors = [];
    if (!active.apiKey) errors.push("API key is not configured.");
    if (!active.model) errors.push("Model is not configured.");
    if (!active.baseUrl) errors.push("Base URL is not configured.");
    if (active.baseUrl) {
      try { new URL(active.baseUrl); } catch { errors.push("Base URL is invalid."); }
    }
    return errors;
  }

  cancel() {
    if (this.controller) {
      try { this.controller.abort(); } catch {}
      this.controller = null;
    }
  }

  /**
   * Stream chat completion. onDelta(textChunk), onDone(fullText), onError(err)
   */
  async streamChat({ messages, signal, onDelta, onDone, onError, timeoutMs = NOVA_GEN_TIMEOUT_MS, onStatus, softTimeout = true }) {
    const raw = this.getConfig();
    const errs = this.validateConfig(raw);
    if (errs.length) {
      const err = new Error(errs[0]);
      onError && onError(err);
      throw err;
    }
    const cfg = resolveActiveEngineConfig(raw);
    const requestId = makeRequestId();
    const strategy = cfg.strategy || "auto";
    const { url, mode, target } = buildRequestUrl(cfg);

    const emitStatus = (text, extra) => {
      try {
        onStatus && onStatus(text, extra);
        if (text) saveConnStatus(Object.assign({ state: "connected", message: text, model: (extra && extra.model) || cfg.model }, extra || {}));
      } catch {}
    };

    const attempts = [];
    const primaryModel = resolveRoutedModel(cfg.model);
    const primaryLabel = NOVA_BRAND.modelName;
    const seen = {};
    const pool = [primaryModel].concat(NOVA_ENGINE_POOL);
    pool.forEach(function (m, idx) {
      const id = resolveRoutedModel(m);
      if (!id || seen[id]) return;
      seen[id] = true;
      attempts.push({
        id: idx === 0 ? "primary" : ("fb" + idx),
        model: id,
        label: primaryLabel,
      });
    });

    this.cancel();
    this.controller = new AbortController();
    const external = signal;
    const onAbort = () => { try { this.controller.abort(); } catch {} };
    if (external) {
      if (external.aborted) this.controller.abort();
      else external.addEventListener("abort", onAbort, { once: true });
    }

    let timedOut = false;
    let lastPartial = "";
    const effectiveTimeout = Math.max(Number(timeoutMs) || 0, NOVA_GEN_TIMEOUT_MS);
    const timer = setTimeout(() => {
      timedOut = true;
      try { this.controller.abort(); } catch {}
    }, effectiveTimeout);

    const runOne = async (attempt, allowFallback) => {
      const started = Date.now();
      this.log("request", {
        requestId,
        provider: attempt.id,
        model: attempt.model,
        mode,
        target,
        allowFallback,
      });
      emitStatus("● " + attempt.label + (attempt.id === "primary" ? " — Primary" : " — Active fallback"), {
        provider: attempt.id,
        model: attempt.model,
      });

      const isNvidia = /integrate\.api\.nvidia\.com/i.test(String(cfg.baseUrl || ""));
      const body = {
        model: resolveRoutedModel(attempt.model),
        messages,
        stream: true,
        temperature: 0.6,
        top_p: 0.95,
        max_tokens: isNvidia ? 4096 : 8192,
      };
      if (isNvidia) {
        body.chat_template_kwargs = { enable_thinking: false };
      }
      const makeInit = (streamOn) => ({
        method: "POST",
        headers: Object.assign(
          {
            "Content-Type": "application/json",
            Accept: streamOn ? "text/event-stream" : "application/json",
            "HTTP-Referer": (typeof location !== "undefined" && location.origin) ? location.origin : "https://nova.code",
            "X-Title": "NOVA CODE",
          },
          cfg.apiKey ? { Authorization: "Bearer " + cfg.apiKey } : {}
        ),
        body: JSON.stringify(Object.assign({}, body, { stream: !!streamOn })),
        signal: this.controller.signal,
      });
      let res;
      try {
        res = await novaFetch(url, makeInit(true));
      } catch (streamErr) {
        this.log("stream_transport_fail", streamErr && streamErr.message);
        res = await novaFetch(url, makeInit(false));
      }

      if (!res.ok) {
        const t = await res.text().catch(() => "");
        let msg = friendlyHttpError(res.status, t);
        try {
          const j = JSON.parse(t);
          if (j?.error?.message) msg = j.error.message;
        } catch {}
        if (/overload|temporarily|capacity|busy|try again/i.test(msg) && !attempt._retried) {
          attempt._retried = true;
          await new Promise((r) => setTimeout(r, 1200));
          return await runOne(attempt, allowFallback);
        }
        msg = /overload|upstream error|temporarily/i.test(msg)
          ? "NOVA Engine is busy. Switching route…"
          : msg;
        const classification = classifyProviderError(res.status, msg + " " + t);
        const latency = Date.now() - started;
        this.log("provider_fail", { requestId, provider: attempt.id, model: attempt.model, status: res.status, classification, latency, msg });
        const err = new Error(msg);
        err.status = res.status;
        err.classification = classification;
        err.provider = attempt.id;
        throw err;
      }

      let full = "";
      let gotContent = false;
      const contentType = (res.headers.get("content-type") || "").toLowerCase();

      const notifyDelta = (delta) => {
        if (delta) gotContent = true;
        lastPartial = full;
        onDelta && onDelta(delta, full);
      };

      if (!res.body || !res.body.getReader || (contentType.includes("application/json") && !contentType.includes("event-stream"))) {
        const data = await res.json();
        // Check JSON error payload
        if (data?.error) {
          const msg = data.error.message || JSON.stringify(data.error);
          const classification = classifyProviderError(data.error.code || 500, msg);
          const err = new Error(msg);
          err.classification = classification;
          err.provider = attempt.id;
          throw err;
        }
        const text = data?.choices?.[0]?.message?.content || data?.choices?.[0]?.delta?.content || "";
        full = text;
        if (text) gotContent = true;
        notifyDelta(text);
        return { full, gotContent, model: attempt.model, provider: attempt.id, label: attempt.label };
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      const consumeLine = (line) => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith(":")) return;
        if (!trimmed.startsWith("data:")) {
          if (trimmed && !trimmed.startsWith("{")) {
            full += line;
            notifyDelta(line);
          }
          return;
        }
        const payload = trimmed.slice(5).trim();
        if (!payload || payload === "[DONE]") return;
        try {
          const json = JSON.parse(payload);
          if (json?.error) {
            const msg = json.error.message || "Stream error";
            const classification = classifyProviderError(json.error.code || 500, msg);
            const err = new Error(msg);
            err.classification = classification;
            err.provider = attempt.id;
            throw err;
          }
          const delta =
            json?.choices?.[0]?.delta?.content ??
            json?.choices?.[0]?.message?.content ??
            json?.delta?.content ??
            json?.content ??
            "";
          if (delta) {
            full += delta;
            notifyDelta(delta);
          }
        } catch (e) {
          if (e && e.classification) throw e;
          if (payload && payload !== "[DONE]") {
            full += payload;
            notifyDelta(payload);
          }
        }
      };

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split(/\r?\n/);
          buffer = parts.pop() || "";
          for (const line of parts) consumeLine(line);
        }
        buffer += decoder.decode();
        if (buffer.trim()) {
          for (const line of buffer.split(/\r?\n/)) consumeLine(line);
        }
      } catch (streamErr) {
        streamErr.gotContent = gotContent;
        streamErr.partialFull = full;
        throw streamErr;
      }
      return { full, gotContent, model: attempt.model, provider: attempt.id, label: attempt.label, latency: Date.now() - started };
    };

    let lastError = null;
    let streamedAny = false;
    try {
      for (let ai = 0; ai < attempts.length; ai++) {
        const attempt = attempts[ai];
        const isLast = ai === attempts.length - 1;
        try {
          const result = await runOne(attempt, !isLast);
          streamedAny = streamedAny || !!result.gotContent;
          ProviderHealth.markSuccess(attempt.id);
          // If primary succeeded after cooldown, restore status
          if (attempt.id === "primary") {
            emitStatus("● " + attempt.label + " — Primary", { provider: "primary", model: attempt.model });
          } else {
            emitStatus("● " + attempt.label + " — Active fallback", { provider: "fallback", model: attempt.model, fallbackUsed: true });
          }
          this.log("provider_ok", {
            requestId,
            provider: attempt.id,
            model: attempt.model,
            fallbackUsed: attempt.id === "fallback",
            finalProvider: attempt.id,
            latency: result.latency,
          });
          onDone && onDone(result.full);
          return result.full;
        } catch (e) {
          lastError = e;
          if (e?.name === "AbortError" || timedOut || /abort/i.test(String(e?.message || e))) {
            throw e;
          }
          if (e.gotContent) streamedAny = true;
          const classification = e.classification || classifyProviderError(e.status, e.message);
          ProviderHealth.markFailure(attempt.id, classification, cfg.cooldownMs);
          // Never fallback after tokens already streamed (avoids duplicate answers)
          const canFb =
            !isLast &&
            !streamedAny &&
            shouldFallback(classification, strategy) &&
            !!attempts[ai + 1];

          if (canFb) {
            emitStatus(
              "⚡ " + (attempt.label || "Primary") + " " + classification.replace(/_/g, " ").toLowerCase() + " — switching to " + (attempts[ai + 1].label || "fallback") + "…",
              { provider: attempt.id, classification, model: attempt.model }
            );
            this.log("fallback", {
              requestId,
              from: attempt.id,
              to: attempts[ai + 1].id,
              classification,
            });
            continue;
          }
          throw e;
        }
      }
      if (lastError) throw lastError;
      throw new Error("No provider available.");
    } catch (e) {
      if (timedOut || e?.name === "AbortError" || /abort/i.test(String(e))) {
        // Soft timeout: keep partial generation so chunk/file assembly can continue
        if (timedOut && softTimeout && lastPartial && lastPartial.length > 30) {
          this.log("soft_timeout", { chars: lastPartial.length, requestId });
          onDone && onDone(lastPartial);
          return lastPartial;
        }
        const err = new Error(timedOut ? "AI request timed out." : "Generation stopped.");
        err.code = timedOut ? "TIMEOUT" : "CANCELLED";
        onError && onError(err);
        throw err;
      }
      const msg = engineUserError(e && e.message);
      saveConnStatus({ state: "error", message: msg });
      const err = new Error(msg);
      err.code = e && e.code;
      onError && onError(err);
      throw err;
    } finally {
      clearTimeout(timer);
      if (external) external.removeEventListener("abort", onAbort);
      this.controller = null;
    }
  }

  async testConnection() {
    const raw = this.getConfig();
    const errs = this.validateConfig(raw);
    if (errs.length) {
      saveConnStatus({ state: "error", message: errs[0] });
      return { ok: false, error: errs[0] };
    }
    const active = resolveActiveEngineConfig(raw);
    try {
      let reply = "";
      await this.streamChat({
        messages: [
          { role: "system", content: "Reply with exactly: OK" },
          { role: "user", content: "ping" },
        ],
        timeoutMs: NOVA_TEST_TIMEOUT_MS,
        onDelta: (_c, f) => { reply = f; },
        onDone: (f) => { reply = f || reply; },
      });
      const msg = "NOVA Engine ready · " + (active.model || "model");
      saveConnStatus({ state: "connected", message: msg, model: active.model, engine: active.engine });
      return { ok: true, reply, engine: active.engine };
    } catch (e) {
      saveConnStatus({ state: "error", message: e.message, engine: active.engine });
      return { ok: false, error: e.message };
    }
  }

}

// Lightweight Markdown → HTML (safe subset)
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderMarkdown(md) {
  const text = String(md || "");
  const parts = [];
  const re = /```([\w+-]*)\n([\s\S]*?)```/g;
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({ type: "text", value: text.slice(last, m.index) });
    parts.push({ type: "code", lang: m[1] || "", value: m[2].replace(/\n$/, "") });
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push({ type: "text", value: text.slice(last) });

  const formatInline = (t) => {
    let s = escapeHtml(t);
    s = s.replace(/`([^`]+)`/g, '<code class="md-inline">$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer" class="text-cyan-300 underline">$1</a>');
    return s;
  };

  return parts.map((p, idx) => {
    if (p.type === "code") {
      const id = "cb-" + idx + "-" + Math.random().toString(36).slice(2, 6);
      return (
        '<div class="md-codewrap my-2 rounded-lg overflow-hidden border border-white/10">' +
        '<div class="flex items-center justify-between px-2 py-1 bg-black/40 text-[10px] text-slate-400">' +
        '<span>' + escapeHtml(p.lang || "code") + '</span>' +
        '<button type="button" data-copy="' + id + '" class="hover:text-white copy-btn">Copy</button></div>' +
        '<pre id="' + id + '" class="p-2 overflow-x-auto text-[11px] leading-relaxed text-slate-200 bg-black/30"><code>' +
        escapeHtml(p.value) + '</code></pre></div>'
      );
    }
    let block = p.value;
    block = block.replace(/^### (.+)$/gm, '<div class="font-semibold text-sm mt-2 mb-1">$1</div>');
    block = block.replace(/^## (.+)$/gm, '<div class="font-semibold text-sm mt-2 mb-1">$1</div>');
    block = block.replace(/^# (.+)$/gm, '<div class="font-semibold mt-2 mb-1">$1</div>');
    block = block.replace(/^\s*[-*] (.+)$/gm, '<div class="pl-3">• $1</div>');
    const paras = block.split(/\n\n+/).map((para) => {
      const lines = para.split(/\n/).map((l) => formatInline(l)).join("<br/>");
      return '<div class="mb-1.5 leading-relaxed">' + lines + "</div>";
    }).join("");
    return paras;
  }).join("");
}

function ToastHost() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    const h = (e) => {
      setItems((x) => [...x, e.detail]);
      setTimeout(() => setItems((x) => x.filter((i) => i.id !== e.detail.id)), 3200);

    window.addEventListener("nova-toast", h);
    return () => window.removeEventListener("nova-toast", h);

  return (
    <div className="fixed top-4 right-4 z-[100] space-y-2">

        <div key={t.id} className="glass px-3 py-2 text-sm rounded-lg min-w-[200px]">
          {t.msg}
        </div>
      ))}
    </div>
  );
}

function FileTree({ node, depth = 0, expanded, onToggle, onOpen, activePath }) {
  if (!node) return null;
  if (node.type === "file") {
    return (
      <button
        onClick={() => onOpen(node.path)}
        className={`w-full text-left flex items-center gap-1.5 py-0.5 px-1 rounded text-xs hover:bg-white/5 ${
          activePath === node.path ? "bg-white/10 text-white" : "text-slate-400"
        }`}
        style={{ paddingLeft: 8 + depth * 12 }}
      >
        <Icon name="file" size={12} />
        <span className="truncate">{node.name}</span>
      </button>
    );
  }
  const isOpen = expanded.has(node.path || "__root");
  return (
    <div>
      <button
        onClick={() => onToggle(node.path || "__root")}
        className="w-full text-left flex items-center gap-1.5 py-0.5 px-1 rounded text-xs text-slate-300 hover:bg-white/5"
        style={{ paddingLeft: 8 + depth * 12 }}
      >
        <span className={`transition ${isOpen ? "rotate-90" : ""}`}><Icon name="chevron" size={12} /></span>
        <Icon name="folder" size={12} />
        <span className="truncate">{node.name}</span>
      </button>
      {isOpen && (node.children || []).map((c) => (
        <FileTree key={c.path} node={c} depth={depth + 1} expanded={expanded} onToggle={onToggle} onOpen={onOpen} activePath={activePath} />
      ))}
    </div>
  );
}

function MonacoPane({ path, value, onChange, onDirty }) {
  const ref = useRef(null);
  const editorRef = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.monaco) return;
    if (editorRef.current) {
      const model = editorRef.current.getModel();
      if (model && model.getValue() !== value) {
        const pos = editorRef.current.getPosition();
        model.setValue(value || "");
        if (pos) editorRef.current.setPosition(pos);
      }
      window.monaco.editor.setModelLanguage(editorRef.current.getModel(), extLang(path));
      return;
    }
    editorRef.current = window.monaco.editor.create(ref.current, {
      value: value || "",
      language: extLang(path),
      theme: "vs-dark",
      automaticLayout: true,
      minimap: { enabled: true, scale: 0.8 },
      fontSize: 13,
      lineHeight: 20,
      padding: { top: 8 },
      scrollBeyondLastLine: false,
      renderLineHighlight: "line",
      overviewRulerLanes: 0,
      scrollbar: { verticalScrollbarSize: 8, horizontalScrollbarSize: 8 },
    });
    editorRef.current.onDidChangeModelContent(() => {
      const v = editorRef.current.getValue();
      onChange && onChange(v);
      onDirty && onDirty(true);
    });
    return () => {};
  }, [path]);
  useEffect(() => {
    if (editorRef.current && value !== editorRef.current.getValue()) {
      editorRef.current.setValue(value || "");
    }
  }, [value]);
  return <div ref={ref} className="w-full h-full" />;
}

function DiffView({ lines }) {

        <div key={i} className={`px-2 whitespace-pre ${l.type === "add" ? "diff-add" : l.type === "del" ? "diff-del" : "text-slate-500"}`}>
          {l.text}
        </div>
      ))}
    </div>
  );
}

function SourceControlPanel({ git, onRefresh, onCommitDone }) {
  const [status, setStatus] = useState(null);
  const [msg, setMsg] = useState("");
  const [selected, setSelected] = useState(null);
  const [diff, setDiff] = useState([]);
  const [history, setHistory] = useState([]);
  const [tab, setTab] = useState("changes");
  const [busy, setBusy] = useState(false);
  const [branchName, setBranchName] = useState("");
  const [remoteUrl, setRemoteUrl] = useState("https://github.com/demo/nova-demo.git");
  const [confirm, setConfirm] = useState(null);

  const refresh = useCallback(() => {
    const st = git.status();
    setStatus(st);
    setHistory(git.log(15));
    onRefresh && onRefresh(st);
  }, [git, onRefresh]);

  useEffect(() => { refresh(); }, [refresh]);

  const showDiff = (path) => {
    setSelected(path);
    setDiff(git.diff(path));
  };

  const doStage = async (paths) => {
    setBusy(true);
    try {
      const r = await git.stage(paths);
      if (r.warnings?.length) toast("Skipped sensitive: " + r.warnings.join(", "), "warn");
      refresh();
    } catch (e) { toast(e.message, "err"); }
    setBusy(false);
  };
  const doUnstage = async (paths) => {
    await git.unstage(paths);
    refresh();
  };
  const doCommit = async () => {
    if (!msg.trim()) return toast("Enter commit message");
    setBusy(true);
    try {
      const r = await git.commit(msg.trim());
      toast("Committed " + r.hash);
      setMsg("");
      refresh();
      onCommitDone && onCommitDone(r);
    } catch (e) { toast(e.message, "err"); }
    setBusy(false);
  };
  const doInit = async () => {
    setConfirm({
      title: "Initialize repository",
      body: "Create a simulated Git repository for this workspace?",
      onYes: async () => {
        await git.init();
        toast("Repository initialized");
        refresh();
        setConfirm(null);
      },
    });
  };

  if (!status) return null;

  if (!status.initialized) {
    return (
      <div className="p-3 space-y-3">
        <div className="text-xs text-slate-400">Git is available (simulated). No repository detected.</div>
        <button onClick={doInit} className="w-full glass-soft rounded-lg py-2 text-sm hover:bg-white/10">Initialize Repository</button>
        <div className="text-[10px] text-slate-500">Honesty: Git runs as a local simulation in the browser. Architecture is ready for real git via ExecutionManager on desktop/WebContainer.</div>
      </div>
    );
  }

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="px-3 py-2 border-b border-white/5 flex items-center gap-2 text-xs">
        <Icon name="git" size={14} />
        <span className="font-medium">{status.branch}</span>
        {status.ahead > 0 && <span className="text-cyan-400">↑{status.ahead}</span>}
        {status.behind > 0 && <span className="text-amber-400">↓{status.behind}</span>}
        <button onClick={refresh} className="ml-auto p-1 rounded hover:bg-white/10"><Icon name="refresh" size={12} /></button>
      </div>
      <div className="flex text-[11px] border-b border-white/5">
        {["changes", "history", "branches", "remote"].map((t) => (
          <button key={t} onClick={() => setTab(t)} className={`px-3 py-1.5 capitalize ${tab === t ? "text-white border-b border-cyan-400/50" : "text-slate-500"}`}>{t}</button>
        ))}
      </div>
      <div className="flex-1 overflow-y-auto scroll-thin p-2 space-y-2 min-h-0">
        {tab === "changes" && (
          <>
            <div className="flex gap-1">
              <button disabled={busy} onClick={() => doStage(status.unstaged.map((f) => f.path))} className="text-[10px] px-2 py-1 rounded glass-soft hover:bg-white/10">Stage All</button>
              <button disabled={busy} onClick={() => doUnstage(status.staged.map((f) => f.path))} className="text-[10px] px-2 py-1 rounded glass-soft hover:bg-white/10">Unstage All</button>
            </div>
            {!!status.staged.length && (
              <div>
                <div className="text-[10px] text-slate-500 uppercase mb-1">Staged</div>
                {status.staged.map((f) => (
                  <div key={f.path} className="flex items-center gap-1 text-xs py-0.5 group">
                    <span className="text-emerald-400 w-3">{f.index}</span>
                    <button className="truncate flex-1 text-left hover:text-white" onClick={() => showDiff(f.path)}>{f.path}</button>
                    {f.sensitive && <span className="text-amber-400 text-[9px]">secret</span>}
                    <button className="opacity-0 group-hover:opacity-100 text-[10px] text-slate-400" onClick={() => doUnstage([f.path])}>−</button>
                  </div>
                ))}
              </div>
            )}
            {!!status.unstaged.length && (
              <div>
                <div className="text-[10px] text-slate-500 uppercase mb-1">Changes</div>
                {status.unstaged.map((f) => (
                  <div key={f.path} className="flex items-center gap-1 text-xs py-0.5 group">
                    <span className="text-amber-400 w-3">{f.worktree}</span>
                    <button className="truncate flex-1 text-left hover:text-white" onClick={() => showDiff(f.path)}>{f.path}</button>
                    {f.sensitive && <span className="text-amber-400 text-[9px]">secret</span>}
                    <button className="opacity-0 group-hover:opacity-100 text-[10px] text-slate-400" onClick={() => doStage([f.path])}>+</button>
                  </div>
                ))}
              </div>
            )}
            {!status.staged.length && !status.unstaged.length && (
              <div className="text-xs text-slate-500 py-4 text-center">Working tree clean</div>
            )}
            {selected && (
              <div className="glass-soft rounded-lg overflow-hidden">
                <div className="px-2 py-1 text-[10px] text-slate-400 border-b border-white/5">{selected}</div>
                <DiffView lines={diff} />
              </div>
            )}
            <div className="pt-2 border-t border-white/5 space-y-2">
              <textarea
                value={msg}
                onChange={(e) => setMsg(e.target.value)}
                placeholder="Commit message"
                className="w-full bg-black/30 border border-white/10 rounded-lg p-2 text-xs min-h-[56px] outline-none focus:border-cyan-500/30"
              />
              <div className="flex gap-2">
                <button
                  onClick={() => setMsg(git.suggestCommitMessage([...status.staged, ...status.unstaged]))}
                  className="text-[10px] px-2 py-1 rounded glass-soft hover:bg-white/10"
                >Suggest</button>
                <button
                  disabled={busy || !status.staged.length}
                  onClick={() => setConfirm({
                    title: "Commit",
                    body: `Commit ${status.staged.length} staged file(s) to ${status.branch}?`,
                    onYes: () => { setConfirm(null); doCommit(); },
                  })}
                  className="flex-1 text-xs py-1.5 rounded-lg bg-white/10 hover:bg-white/15 disabled:opacity-40"
                >Commit</button>
              </div>
            </div>
          </>
        )}
        {tab === "history" && (
          <div className="space-y-1">
            {history.map((c) => (
              <div key={c.hash} className="glass-soft rounded-lg p-2 text-xs">
                <div className="font-mono text-cyan-300/80">{c.hash}</div>
                <div className="text-slate-200 mt-0.5">{c.message}</div>
                <div className="text-[10px] text-slate-500 mt-1">{c.author} · {new Date(c.date).toLocaleString()}</div>
              </div>
            ))}
            {!history.length && <div className="text-slate-500 text-xs">No commits</div>}
          </div>
        )}
        {tab === "branches" && (
          <div className="space-y-2">
            {git.branches().map((b) => (
              <button
                key={b}
                onClick={() => {
                  const r = git.repo.switchBranch(b);
                  if (r.needsConfirm) {
                    setConfirm({
                      title: "Uncommitted changes",
                      body: "Switching branches may affect your workspace. Continue?",
                      onYes: () => { git.repo.switchBranch(b, { force: true }); refresh(); setConfirm(null); },
                    });
                  } else { refresh(); }
                }}
                className={`w-full text-left px-2 py-1.5 rounded-lg text-xs ${b === status.branch ? "bg-white/10 text-white" : "hover:bg-white/5 text-slate-400"}`}
              >
                {b === status.branch ? "● " : "○ "}{b}
              </button>
            ))}
            <div className="flex gap-1 pt-2">
              <input value={branchName} onChange={(e) => setBranchName(e.target.value)} placeholder="feature/name" className="flex-1 bg-black/30 border border-white/10 rounded px-2 py-1 text-xs outline-none" />
              <button
                onClick={() => {
                  try {
                    git.createBranch(branchName.trim());
                    setBranchName("");
                    refresh();
                    toast("Branch created");
                  } catch (e) { toast(e.message, "err"); }
                }}
                className="px-2 rounded glass-soft text-xs"
              >Create</button>
            </div>
          </div>
        )}
        {tab === "remote" && (
          <div className="space-y-2 text-xs">
            <div className="text-slate-500">Remotes</div>
            {Object.entries(status.remotes || {}).map(([n, u]) => (
              <div key={n} className="glass-soft rounded p-2">
                <div className="font-medium">{n}</div>
                <div className="text-[10px] text-slate-400 break-all">{u}</div>
              </div>
            ))}
            {!Object.keys(status.remotes || {}).length && <div className="text-slate-500">No remotes</div>}
            <input value={remoteUrl} onChange={(e) => setRemoteUrl(e.target.value)} className="w-full bg-black/30 border border-white/10 rounded px-2 py-1 text-xs outline-none" />
            <button
              onClick={() => { git.setRemote("origin", remoteUrl.trim()); refresh(); toast("Remote set"); }}
              className="w-full py-1.5 rounded glass-soft hover:bg-white/10"
            >Set origin</button>
            <button
              onClick={() => setConfirm({
                title: "Push to origin",
                body: "Push current branch to origin? (simulated)",
                onYes: async () => {
                  setConfirm(null);
                  const r = await git.repo.handleCli(["push"], () => {});
                  toast(r.exitCode === 0 ? "Push succeeded" : "Push failed");
                  refresh();
                },
              })}
              className="w-full py-1.5 rounded glass-soft hover:bg-white/10"
            >Push</button>
            <button
              onClick={async () => {
                const r = await git.repo.handleCli(["fetch"], () => {});
                toast(r.exitCode === 0 ? "Fetched" : "Fetch failed");
              }}
              className="w-full py-1.5 rounded glass-soft hover:bg-white/10"
            >Fetch</button>
            <div className="text-[10px] text-slate-500 pt-2">GitHub auth is not connected. Local Git works without GitHub.</div>
          </div>
        )}
      </div>
      {confirm && (
        <div className="absolute inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50 p-4">
          <div className="glass rounded-2xl p-4 max-w-sm w-full space-y-3">
            <div className="font-medium text-sm">{confirm.title}</div>
            <div className="text-xs text-slate-400">{confirm.body}</div>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setConfirm(null)} className="px-3 py-1.5 text-xs rounded-lg hover:bg-white/10">Cancel</button>
              <button onClick={confirm.onYes} className="px-3 py-1.5 text-xs rounded-lg bg-white/15 hover:bg-white/20">Confirm</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MarkdownMessage({ content, streaming }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const root = ref.current;
    if (!root) return;
    root.querySelectorAll("button[data-copy]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.getAttribute("data-copy");
        const el = document.getElementById(id);
        if (el) navigator.clipboard.writeText(el.innerText).then(() => toast("Copied"));
      };
    });
  }, [content]);
  return (
    <div
      ref={ref}
      className={"text-slate-200 text-xs" + (streaming ? " stream-cursor" : "")}
      dangerouslySetInnerHTML={{ __html: renderMarkdown(content || "") }}
    />
  );
}
