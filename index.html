          </div>

          <div className="flex-1 flex flex-col gap-3 min-w-0 min-h-0">
            <div className="flex-1 glass rounded-2xl flex flex-col min-h-0 overflow-hidden">
              {centerMode === "ai" ? (
                <AIWorkspace
                  stage={wsStage}
                  setStage={setWsStage}
                  prompt={wsPrompt}
                  summary={wsSummary}
                  features={wsFeatures}
                  setFeatures={setWsFeatures}
                  brief={wsBrief}
                  research={wsResearch}
                  design={wsDesign}
                  setDesign={setWsDesign}
                  buildLog={wsBuildLog}
                  previewHtml={wsPreview}
                  projectLabel={wsLabel}
                  busy={streaming || agentStatus !== "IDLE"}
                  isBuilding={!!(genJob && (genJob.status === "BUILDING" || genJob.status === "VERIFYING")) || wsStage === "build"}
                  canBuild={
                    !!(wsPrompt && (wsFeatures || []).some((f) => f.on)) &&
                    wsStage === "plan" &&
                    !(genJob && (genJob.status === "BUILDING" || genJob.status === "VERIFYING")) &&
                    wsStage !== "build"
                  }
                  buildBlockedReason={
                    (genJob && (genJob.status === "BUILDING" || genJob.status === "VERIFYING")) ? "A build is already running."
                    : !(wsFeatures || []).some((f) => f.on) ? "Select at least one feature before building."
                    : !wsPrompt ? "No project prompt — go back and describe what to build."
                    : ""
                  }
                  buildError={wsBuildError}
                  review={wsReview}
                  onConfirmUnderstand={() => { setAgentStatus("IDLE"); setStreaming(false); setWsStage("features"); }}
                  onOpenDev={() => setCenterMode("dev")}
                  onStartBuild={async () => {
                    if (buildLockRef.current) return;
                    const selected = (wsFeatures || []).filter((f) => f.on);
                    if (!wsPrompt || !selected.length) {
                      setWsBuildError("Select at least one feature and keep the project prompt.");
                      return;
                    }
                    const cfg = loadAIConfig();
                    if (!cfg.apiKey || !cfg.baseUrl) {
                      setWsBuildError("NOVA Engine is not ready. Retry in a moment.");
                      return;
                    }
                    console.log("[NOVA] build:start", { files: "pending", features: selected.length });
                    buildLockRef.current = true;
                    setWsBuildError("");
                    setAgentStatus("IDLE");
                    genCancelRef.current = false;
                    const constraints = wsConstraints || extractConstraints(wsPrompt);
                    setWsConstraints(constraints);
                    let tasks = planFileManifest(wsLabel, wsPrompt, wsFeatures, wsDesign, constraints).map((t) => ({
                      ...t, status: "pending", retries: 0,
                    }));
                    const planCheck = validatePlan(tasks, constraints);
                    if (!planCheck.ok) {
                      console.warn(planCheck.errors);
                      tasks = planFileManifest(wsLabel, wsPrompt, wsFeatures, wsDesign, constraints).map((t) => ({
                        ...t, status: "pending", retries: 0,
                      }));
                    }
                    const job = {
                      id: uid(),
                      projectLabel: wsLabel || "Project",
                      prompt: wsPrompt,
                      design: wsDesign,
                      features: wsFeatures,
                      research: wsResearch,
                      designContext: wsBrief && wsBrief.designContext,
                      tasks,
                      phase: "BUILDING",
                      status: "BUILDING",
                      startedAt: now(),
                      updatedAt: now(),
                      completedFiles: [],
                      lines: 0,
                    };
                    setGenJob(job);
                    saveGenJob(job);
                    setWsStage("build");
                    setWsBuildLog([{ text: "Generation job created — " + tasks.length + " files planned", done: true }]);
                    setMessages((m) => [...m, {
                      id: uid(), role: "assistant", status: "complete", timestamp: now(),
                      content: "build-started",
                      displayContent: "Starting **file-by-file** generation for **" + job.projectLabel + "**.\n\n" +
                        tasks.length + " files planned. Source code is written to the project — not shown here.",
                      buildProgress: true,
                    }]);
                    setAgentStatus("GENERATING");
                    setStreaming(true);

                    try {
                    const paths = tasks.map((t) => t.path);
                    let linesTotal = 0;
                    const completed = [];

                    for (let i = 0; i < tasks.length; i++) {
                      if (genCancelRef.current) {
                        job.status = "CANCELLED";
                        job.phase = "CANCELLED";
                        break;
                      }
                      const task = tasks[i];
                      task.status = "generating";
                      job.tasks = tasks.map((t, j) => j === i ? { ...task } : t);
                      job.updatedAt = now();
                      setGenJob({ ...job, tasks: [...tasks] });
                      saveGenJob(job);
                      setWsBuildLog((log) => [...log.filter((l) => l.sticky), {
                        text: "Generating " + task.path + " (" + (i + 1) + "/" + tasks.length + ")",
                        done: false,
                        sticky: false,
                      }]);
                      setMessages((m) => {
                        const filtered = m.filter((x) => !x.liveBuild);
                        return [...filtered, {
                          id: "build-live",
                          liveBuild: true,
                          role: "assistant",
                          status: "streaming",
                          timestamp: now(),
                          content: "building",
                          displayContent: "",
                          genSnapshot: {
                            label: job.projectLabel,
                            progress: computeProgress(job),
                            current: task.path,
                            tasks: tasks.map((t) => ({ path: t.path, status: t.status })),
                            filesDone: completed.length,
                            filesTotal: tasks.length,
                            lines: linesTotal,
                          },
                        }];
                      });

                                            let ok = false;
                      for (let attempt = 0; attempt < 3 && !ok; attempt++) {
                        try {
                          const gate = validateFileOperation(task.path, constraints);
                          if (!gate.ok) {
                            throw new Error(gate.reason || "File blocked by constraints");
                          }
                          setWsBuildLog((log) => [...log, { text: "Analyzing prompt…", done: false }]);
                          setWsBuildLog((log) => [...log, { text: "Creating files · " + task.path + (attempt ? " (retry " + attempt + ")" : ""), done: false }]);

                          const singleHtml = !!(constraints && constraints.outputMode === "single-file" && /\.html?$/i.test(task.path));
                          let content = "";
                          if (singleHtml) {
                            const chunked = await generateHtmlFileChunked(
                              aiClient,
                              {
                                path: task.path,
                                purpose: task.purpose,
                                projectLabel: job.projectLabel,
                                prompt: job.prompt,
                                design: job.design,
                                features: job.features,
                                research: job.research,
                                designContext: job.designContext || (wsBrief && wsBrief.designContext),
                              },
                              (prog) => {
                                setWsBuildLog((log) => [...log, { text: prog.message, done: false }]);
                                setMessages((msgs) => {
                                  const copy = msgs.slice();
                                  const live = copy.find((x) => x.liveBuild);
                                  if (live) {
                                    live.genSnapshot = Object.assign({}, live.genSnapshot || {}, {
                                      current: task.path + " · chunk " + prog.chunk + "/" + prog.total,
                                      progress: computeProgress(job),
                                    });
                                  }
                                  return copy.slice();
                                });
                              }
                            );
                            content = chunked.content;
                          } else {
                            content = await generateOneFile(aiClient, {
                              path: task.path,
                              purpose: task.purpose,
                              projectLabel: job.projectLabel,
                              prompt: job.prompt,
                              design: job.design,
                              features: job.features,
                              existingPaths: paths,
                              constraints: constraints,
                              research: job.research,
                            });
                          }

                          const validation = validateGeneratedFile(task.path, content);
                          if (!validation.ok) {
                            throw new Error("Validation failed: " + validation.issues.join("; "));
                          }

                          await atomicWriteFile(fs, task.path, content);
                          const written = (fs.files && fs.files[task.path]) || "";
                          if (!written || written.length < 20) {
                            throw new Error("Write verification failed for " + task.path);
                          }

                          const lineCount = written.split("\n").length;
                          linesTotal += lineCount;
                          task.status = "completed";
                          task.retries = attempt;
                          task.bytes = written.length;
                          task.lines = lineCount;
                          if (completed.indexOf(task.path) < 0) completed.push(task.path);
                          ok = true;
                          refreshTree();
                          setWsBuildLog((log) => [...log, {
                            text: "✓ " + task.path + " validated · " + lineCount + " lines · " + Math.round(written.length / 1024) + " KB",
                            done: true,
                          }]);
                          console.log("[NOVA GEN]", { path: task.path, status: "committed", lines: lineCount, bytes: written.length });
                        } catch (err) {
                          task.retries = attempt + 1;
                          setWsBuildLog((log) => [...log, { text: "Retry " + (attempt + 1) + " for " + task.path + ": " + (err.message || err), done: false }]);
                          await sleep(500);
                        }
                      }
                      if (!ok) {
                        task.status = "failed";
                        setWsBuildLog((log) => [...log, { text: "⚠ Failed " + task.path, done: true }]);
                      }
                      job.tasks = [...tasks];
                      job.lines = linesTotal;
                      job.completedFiles = [...completed];
                      job.updatedAt = now();
                      setGenJob({ ...job });
                      saveGenJob(job);
                    }

                    // DESIGN REVIEW + REFINE
                    if (job.status !== "CANCELLED" && completed.length) {
                      let review = designReviewProject(fs.files, wsBrief, job.prompt);
                      job.review = review;
                      setWsReview(review);
                      setWsStage("review");
                      setWsBuildLog((log) => [...log, { text: "Design review " + review.total + "/80 — " + (review.passed ? "PASS" : "REJECT"), done: true }]);
                      let cycles = 0;
                      while (!review.passed && cycles < 3 && !genCancelRef.current) {
                        cycles++;
                        setWsStage("refine");
                        setWsBuildLog((log) => [...log, { text: "Refine cycle " + cycles + "/3 — fixing " + (review.issues || []).length + " issues", done: false }]);
                        const refined = await refineProjectFromReview(aiClient, fs.files, review, job.prompt, job.designContext || (wsBrief && wsBrief.designContext));
                        if (refined.ok && refined.path) {
                          fs.files[refined.path] = refined.content;
                          try { await fs.writeFile(refined.path, refined.content); } catch { fs.persist && fs.persist(); }
                          refreshTree();
                        }
                        review = designReviewProject(fs.files, wsBrief, job.prompt);
                        job.review = review;
                        setWsReview(review);
                        setWsBuildLog((log) => [...log, { text: "Re-review " + review.total + "/80 — " + (review.passed ? "PASS" : "still failing"), done: true }]);
                      }
                      if (!review.passed) {
                        job.phase = "REVIEW_FAILED";
                        job.status = "REVIEW_FAILED";
                        setGenJob({ ...job });
                        saveGenJob(job);
                        setWsStage("review");
                        setWsBuildLog((log) => [...log, { text: "Quality gate blocked delivery. Score " + review.total + "/80.", done: true }]);
                        setMessages((m) => {
                          const filtered = m.filter((x) => !x.liveBuild);
                          return [...filtered, {
                            id: uid(), role: "assistant", status: "error", timestamp: now(),
                            content: "review-failed",
                            displayContent: "**DESIGN REVIEW REJECTED** (" + review.total + "/80)\n\n" +
                              (review.issues || []).map((i) => "• " + i.name + " — " + i.fix).join("\n") +
                              "\n\nFiles stay in the project. Refine and Build again.",
                          }];
                        });
                        setAgentStatus("IDLE");
                        buildLockRef.current = false;
                        return;
                      }
                    }

                    // VERIFY
                    if (job.status !== "CANCELLED") {
                      job.phase = "VERIFYING";
                      job.status = "VERIFYING";
                      setWsStage("verify");
                      setGenJob({ ...job });
                      setWsBuildLog((log) => [...log, { text: "Verifying generated files…", done: false }]);
                      let missing = 0;
                      for (const t of tasks) {
                        if (t.status === "completed" && !(t.path in fs.files)) missing++;
                      }
                      await sleep(500);
                      setWsBuildLog((log) => [...log, {
                        text: missing ? ("⚠ " + missing + " missing after write") : "✓ All completed files present on disk",
                        done: true,
                      }]);
                      // Final salvage: any task still failed but path missing — do not fake success
                      const fileActions = completed.map((p) => ({
                        path: p,
                        ok: true,
                        created: true,
                        size: ((fs.files && fs.files[p]) || "").length,
                      })).filter((f) => f.size > 0 || (fs.files && f.path in fs.files));

                      // If we wrote files but size 0 still include them if key exists
                      const realCompleted = completed.filter((p) => fs.files && (p in fs.files));
                      console.log("[NOVA GEN]", {
                        plannedFiles: tasks.length,
                        generatedFiles: realCompleted.length,
                        files: realCompleted.map((p) => ({ path: p, size: (fs.files[p] || "").length })),
                      });

                      if (realCompleted.length === 0) {
                        job.phase = "FAILED";
                        job.status = "FAILED";
                        job.progress = Math.max(job.progress || 0, 5);
                        job.error = "Generation finished but no files were saved (extraction/write failed).";
                        setGenJob({ ...job });
                        saveGenJob(job);
                        setWsStage("plan");
                        setMessages((m) => {
                          const filtered = m.filter((x) => !x.liveBuild);
                          return [...filtered, {
                            id: uid(), role: "assistant", status: "error", timestamp: now(),
                            content: "Generation failed: no files were persisted.",
                            displayContent: "✗ **GENERATION FAILED**\\n\\nPlanned: " + tasks.length + " file(s)\\nSaved: **0**\\n\\nThe model responded but NOVA could not extract/save file content.\\nTry **Build** again, or switch model/provider.",
                            fileActions: [],
                            projectComplete: false,
                          }];
                        });
                        toast("No files saved — generation failed", "err");
                      } else {
                        job.phase = "PACKAGING";
                        job.status = "COMPLETED";
                        job.progress = 100;
                        job.completedFiles = realCompleted;
                        setGenJob({ ...job });
                        saveGenJob(job);
                        setWsStage("preview");
                        let previewSet = false;
                        if (realCompleted.includes("index.html") && fs.files["index.html"]) {
                          setWsPreview(fs.files["index.html"]);
                          previewSet = true;
                        }
                        if (!previewSet) {
                          const isCalc = /calculat/i.test(wsPrompt + wsLabel);
                          if (isCalc) setWsPreview(buildCalculatorPreviewHtml());
                          else setWsPreview(buildGenericPreviewHtml(job.projectLabel || "Project", realCompleted.length));
                        }
                        const actions = realCompleted.map((p) => ({
                          path: p,
                          ok: true,
                          created: true,
                          size: (fs.files[p] || "").length,
                        }));
                        setMessages((m) => {
                          const filtered = m.filter((x) => !x.liveBuild);
                          return [...filtered, {
                            id: uid(), role: "assistant", status: "complete", timestamp: now(),
                            content: "complete",
                            displayContent: "✓ **PROJECT COMPLETE**\\n\\n**" + job.projectLabel + "**\\n\\nFiles: " + realCompleted.length + " / " + tasks.length + "\\nLines: ~" + linesTotal + "\\n\\nDownload or Share from the file card below.\n\nReview (heuristic): design " + review.design + "/10 · code " + review.code + "/10 · performance " + review.performance + "/10.",
                            fileActions: actions,
                            projectComplete: true,
                          }];
                        });
                        const review = {
                          design: realCompleted.some((p) => /html$/i.test(p) && /<style/i.test(fs.files[p] || "")) ? 8 : 6,
                          code: realCompleted.every((p) => (fs.files[p] || "").length > 80) ? 8 : 5,
                          performance: 7,
                        };
                        toast("Project generation complete · " + realCompleted.length + " file(s)");
                      }
                    } else if (job.status === "CANCELLED") {
                      setMessages((m) => {
                        const filtered = m.filter((x) => !x.liveBuild);
                        return [...filtered, {
                          id: uid(), role: "assistant", status: "complete", timestamp: now(),
                          content: "cancelled",
                          displayContent: "Generation **cancelled**. Files already written were kept.",
                        }];
                      });
                      setWsStage("confirm");
                    }
                    } catch (fatal) {
                      console.error("[NOVA GEN]", fatal);
                      setWsBuildLog((log) => [...log, { text: "✗ Generation failed: " + (fatal.message || fatal), done: true }]);
                      setMessages((m) => {
                        const filtered = m.filter((x) => !x.liveBuild);
                        return [...filtered, {
                          id: uid(), role: "assistant", status: "error", timestamp: now(),
                          content: "failed",
                          displayContent: "**GENERATION FAILED**\n\n" + (fatal.message || String(fatal)) + "\n\nUse **Build Project** to retry. Completed files (if any) remain in the project.",
                        }];
                      });
                      setAgentStatus("IDLE");
                      setWsStage("plan");
                      setWsBuildError("Build failed. NOVA could not generate the project. " + (fatal.message || ""));
                      toast(fatal.message || "Generation failed", "err");
                    } finally {
                      setStreaming(false);
                      setAgentStatus("IDLE");
                      genCancelRef.current = false;
                      buildLockRef.current = false;
                      console.log("[NOVA] build:finally");
                    }
                  }}
                />
              ) : (
                <>
                  <div className="flex items-center gap-1 px-2 py-1 border-b border-white/5 overflow-x-auto">
                    <button type="button" onClick={() => setCenterMode("ai")} className="text-[10px] text-cyan-300/80 px-2 hover:text-cyan-200">← AI Workspace</button>
                    {tabs.map((t) => (
                      <button key={t.path} type="button" onClick={() => setActivePath(t.path)}
                        className={"px-2.5 py-1 rounded-lg text-[11px] flex items-center gap-1 " + (activePath === t.path ? "bg-white/10 text-white" : "text-slate-500 hover:bg-white/5")}>
                        {t.path.split("/").pop()}
                        {t.dirty && <span className="w-1.5 h-1.5 rounded-full bg-cyan-400" />}
                        <span className="ml-1 opacity-50 hover:opacity-100" onClick={(e) => {
                          e.stopPropagation();
                          setTabs((x) => x.filter((y) => y.path !== t.path));
                          if (activePath === t.path) setActivePath(null);
                        }}>×</span>
                      </button>
                    ))}
                    {!tabs.length && <span className="text-[11px] text-slate-600 px-2">Open a file from Explorer</span>}
                  </div>
                  <div className="flex-1 min-h-0">
                    {activeTab ? (
                      <MonacoPane path={activeTab.path} value={activeTab.content} onChange={updateContent} />
                    ) : (
                      <div className="h-full flex items-center justify-center text-slate-600 text-sm">Developer Mode — open a file</div>
                    )}
                  </div>
                </>
              )}
            </div>
            <div className="h-36 shrink-0 glass rounded-2xl overflow-hidden">
              <TerminalPanel lines={termLines} running={termRunning} onClear={() => setTermLines([])} onStop={() => executionManager.stopAll()} />
            </div>
          </div>

          <div className="w-80 shrink-0 glass rounded-2xl overflow-hidden">
            <AgentPanel
              activity={activity}
              plan={plan}
              status={agentStatus}
              messages={messages}
              pendingApproval={pendingApproval}
              onSend={handleAgent}
              onStop={handleStop}
              onApprove={onApprove}
              onReject={onReject}
              streaming={streaming}
              aiConfigured={aiConfigured}
              modelLabel={modelLabel}
              chatList={chatList}
              activeChatId={activeChatId}
              hideHistory={true}
              projectName={(projectCatalog.find((p) => p.id === currentProjectId) || {}).name}
              brief={wsBrief}
              stage={wsStage}
              onOpenFile={(p) => openFile(p)}
              onDownloadFile={async (p) => {
                try {
                  const c = await fs.readFile(p);
                  const name = (p.split("/").pop() || p);
                  downloadTextFile(name, c);
                  toast("Downloading " + name + " — check Chrome Downloads / Files app");
                } catch (e) { toast(e.message, "err"); }
              }}
              onShareFile={async (p) => {
                try {
                  const c = await fs.readFile(p);
                  const name = (p.split("/").pop() || p);
                  const result = await shareGeneratedFile(name, c);
                  if (result && result.mode === "cancelled") return;
                  if (result && result.mode === "text") toast("Shared as text (file share unavailable)");
                  else toast("Share sheet opened");
                } catch (e) {
                  toast(e.message || "Share failed — use Download", "err");
                }
              }}
              onDownloadZip={async (fileActions) => {
                const files = [];
                for (const f of fileActions) {
                  try {
                    const c = await fs.readFile(f.path);
                    files.push({ path: f.path, content: c });
                  } catch {}
                }
                if (!files.length) {
                  toast("No files to download", "err");
                  return;
                }
                try {
                  await downloadFilesZip(files, "nova-generated.zip");
                  toast("Downloading nova-generated.zip — check Downloads folder");
                } catch (e) {
                  toast(e.message || "ZIP download failed", "err");
                }
              }}
              onNewChat={() => {
                if (messages.length) {
                  const entry = {
                    id: activeChatId,
                    title: deriveChatTitle(messages),
                    updatedAt: now(),
                    messages: messages.map((m) => ({
                      id: m.id, role: m.role, content: m.content,
                      displayContent: m.displayContent, status: m.status,
                      fileActions: m.fileActions, timestamp: m.timestamp,
                    })),
                  };
                  setChatList((list) => {
                    const rest = list.filter((c) => c.id !== entry.id);
                    const next = [entry, ...rest].slice(0, 50);
                    saveChatHistory(next);
                    return next;
                  });
                }
                setActiveChatId(uid());
                setMessages([]);
                setActivity([]);
                setPlan(null);
                setCurrentTask(null);
                setWsStage("idle");
                setWsPrompt("");
                setWsConstraints(null);
                setWsBuildLog([]);
                setWsPreview("");
                setAgentStatus("IDLE");
                toast("New chat");
              }}
              onOpenChat={(id) => {
                const c = chatList.find((x) => x.id === id);
                if (!c) return;
                if (messages.length && activeChatId !== id) {
                  const entry = {
                    id: activeChatId,
                    title: deriveChatTitle(messages),
                    updatedAt: now(),
                    messages,
                  };
                  setChatList((list) => {
                    const rest = list.filter((x) => x.id !== entry.id && x.id !== id);
                    const next = [entry, ...rest].slice(0, 50);
                    saveChatHistory(next);
                    return next;
                  });
                }
                setActiveChatId(id);
                setMessages(c.messages || []);
                setPlan(null);
              }}
              onClearChat={() => { setMessages([]); setActivity([]); setPlan(null); }}
            />
          </div>
        </div>
      </div>
      )}
      <ToastHost />
    </div>
  );
}

class NovaErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("[NOVA] UI crash", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{padding:24,color:"#e8eaed",fontFamily:"system-ui",maxWidth:560}}>
          <h2 style={{margin:"0 0 8px"}}>NOVA failed to render</h2>
          <p style={{color:"#94a3b8",fontSize:13}}>{String(this.state.error.message || this.state.error)}</p>
          <button
            style={{marginTop:12,padding:"8px 12px",borderRadius:8,border:"1px solid rgba(148,163,184,0.3)",background:"rgba(255,255,255,0.08)",color:"#e8eaed",cursor:"pointer"}}
            onClick={() => {
              try {
                localStorage.removeItem("nova-demo-fs");
                localStorage.removeItem("nova-git-state-v1");
              } catch {}
              location.reload();
            }}
          >Reset local data & reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(
    <NovaErrorBoundary><App /></NovaErrorBoundary>
  );
} catch (e) {
  console.error("[NOVA] boot failure", e);
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;color:#e8eaed;font-family:system-ui"><h2>NOVA boot error</h2><p style="color:#94a3b8">' +
    String(e.message || e) +
    '</p><button onclick="localStorage.clear();location.reload()" style="margin-top:12px;padding:8px 12px;border-radius:8px;border:1px solid #334;background:#1a1f2a;color:#eee">Clear storage & reload</button></div>';
}

</script>
</body>
