const WS_STAGES = ["understand", "research", "confirm", "features", "plan", "build", "review", "refine", "verify", "preview"];



async function tinyfishSearch(query, extra) {
  extra = extra || {};
  const params = new URLSearchParams();
  params.set("query", query);
  params.set("language", extra.language || "en");
  if (extra.include_domains) params.set("include_domains", extra.include_domains);
  const url = TINYFISH_SEARCH_URL + "?" + params.toString();
  const res = await novaFetch(url, {
    method: "GET",
    headers: { "X-API-Key": TINYFISH_API_KEY, "Accept": "application/json" },
  });
  const text = await res.text();
  let data = {};
  try { data = JSON.parse(text); } catch { data = { raw: text }; }
  if (!res.ok) {
    const err = new Error((data && data.error && data.error.message) || ("TinyFish search " + res.status));
    err.status = res.status;
    throw err;
  }
  return Array.isArray(data.results) ? data.results : [];
}

async function tinyfishFetchUrls(urls) {
  const list = (urls || []).filter(Boolean).slice(0, 2);
  if (!list.length) return [];
  const res = await novaFetch(TINYFISH_FETCH_URL, {
    method: "POST",
    headers: {
      "X-API-Key": TINYFISH_API_KEY,
      "Content-Type": "application/json",
      "Accept": "application/json",
    },
    body: JSON.stringify({ urls: list }),
  });
  const text = await res.text();
  let data = {};
  try { data = JSON.parse(text); } catch { data = {}; }
  if (!res.ok) return [];
  return Array.isArray(data.results) ? data.results : [];
}

function extractTinyFishKnowledge(results) {
  const items = (results || []).slice(0, 8);
  const practices = [];
  const mistakes = [];
  const libs = [];
  const sources = [];
  items.forEach(function (r) {
    const title = r.title || "";
    const snip = r.snippet || r.text || "";
    const url = r.url || r.final_url || "";
    sources.push({ title: title, url: url, site: r.site_name || "", snippet: String(snip).slice(0, 220) });
    const blob = (title + " " + snip).toLowerCase();
    if (/best practice|recommended|should|use /.test(blob)) practices.push((title || snip).slice(0, 140));
    if (/avoid|don't|deprecated|outdated|mistake|anti-pattern/.test(blob)) mistakes.push((title || snip).slice(0, 140));
    if (/react|next\.js|tailwind|stripe|supabase|firebase|vue|angular/.test(blob)) libs.push(title.slice(0, 80));
  });
  return {
    practices: practices.slice(0, 5),
    mistakes: mistakes.slice(0, 4),
    libraries: libs.slice(0, 5),
    sources: sources,
    security: ["Validate all user input", "Never expose secrets in the client beyond intended public keys", "Use HTTPS assets only"],
    performance: ["Lazy-load heavy media", "Keep critical CSS small", "Avoid layout shift on hero images"],
  };
}

function buildResearchQueries(brief, prompt) {
  const label = (brief && brief.label) || "web app";
  const type = (brief && brief.type) || "app";
  const q1 = label + " " + type + " architecture best practices 2026";
  const q2 = String(prompt || label) + " UI UX patterns official docs";
  const tech = ((brief && brief.tech) || []).join(" ");
  const q3 = (tech ? tech + " " : "") + type + " performance accessibility security";
  return [q1, q2, q3].slice(0, 3);
}

async function runTinyFishResearch(brief, prompt, onProgress) {
  const report = {
    status: "ok",
    queries: [],
    knowledge: extractTinyFishKnowledge([]),
    pages: [],
    error: "",
  };
  try {
    if (onProgress) onProgress("Researching with TinyFish…");
    const queries = buildResearchQueries(brief, prompt);
    report.queries = queries;
    let all = [];
    for (let i = 0; i < queries.length; i++) {
      if (onProgress) onProgress("Searching: " + queries[i].slice(0, 64));
      try {
        const rows = await tinyfishSearch(queries[i]);
        all = all.concat(rows || []);
      } catch (e) {
        report.error = e.message || String(e);
      }
    }
    // Prefer official docs / github for fetch
    const ranked = all.slice().sort(function (a, b) {
      const score = function (u) {
        const s = String((u && u.url) || "").toLowerCase();
        if (/developer.mozilla.org|react.dev|nextjs.org|tailwindcss.com|web.dev/.test(s)) return 3;
        if (/github.com/.test(s)) return 2;
        return 1;
      };
      return score(b) - score(a);
    });
    const fetchUrls = ranked.slice(0, 2).map(function (r) { return r.url; }).filter(Boolean);
    if (fetchUrls.length) {
      if (onProgress) onProgress("Reading documentation…");
      try {
        report.pages = await tinyfishFetchUrls(fetchUrls);
        report.pages.forEach(function (pg) {
          if (pg && pg.text) {
            all.push({
              title: pg.title || pg.url,
              snippet: String(pg.text).replace(/\s+/g, " ").slice(0, 280),
              url: pg.url || pg.final_url,
              site_name: "docs",
            });
          }
        });
      } catch (e) {}
    }
    report.knowledge = extractTinyFishKnowledge(all);
    if (!all.length && report.error) report.status = "degraded";
    if (onProgress) onProgress("Creating architecture from research…");
    return report;
  } catch (e) {
    report.status = "error";
    report.error = e.message || String(e);
    return report;
  }
}

function formatResearchForPrompt(report) {
  if (!report) return "";
  const k = report.knowledge || {};
  const lines = ["TinyFish research notes (use these; do not invent outdated APIs):"];
  (k.practices || []).forEach(function (x) { lines.push("- Practice: " + x); });
  (k.mistakes || []).forEach(function (x) { lines.push("- Avoid: " + x); });
  (k.libraries || []).forEach(function (x) { lines.push("- Library signal: " + x); });
  (k.sources || []).slice(0, 5).forEach(function (s) {
    lines.push("- Source: " + (s.title || "") + " " + (s.url || ""));
  });
  return lines.join("\n");
}

function slugId(label) {
  return String(label || "feat").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 28) || "feat";
}

function feat(label, desc, group, on) {
  return { id: slugId(label), label: label, desc: desc, group: group || "recommended", on: on !== false };
}


function titleCaseWords(s) {
  return String(s || "").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}

function extractPromptKeywords(prompt) {
  const stop = { a:1, an:1, the:1, and:1, or:1, for:1, with:1, from:1, that:1, this:1, into:1, onto:1, your:1, my:1, our:1, create:1, build:1, make:1, want:1, please:1, just:1, simple:1, modern:1, sleek:1, premium:1, using:1, using:1, give:1, code:1, file:1, website:1, app:1, application:1, page:1, pages:1 };
  return String(prompt || "").toLowerCase().split(/[^a-z0-9+#]+/).filter(function (w) {
    return w.length > 2 && !stop[w];
  });
}

function featuresFromPrompt(prompt, extras) {
  extras = extras || [];
  const words = extractPromptKeywords(prompt);
  const out = [];
  const seen = {};
  function add(label, desc, on) {
    const id = slugId(label);
    if (seen[id]) return;
    seen[id] = true;
    out.push(feat(label, desc || ("Required by: " + label), "recommended", on !== false));
  }
  extras.forEach(function (e) {
    if (typeof e === "string") add(e, "", true);
    else add(e.label, e.desc, e.on !== false);
  });
  const MAP = [
    [/3d|three|webgl|planet|galaxy|space|starfield|orbit/, ["WebGL / 3D canvas", "Camera controls", "Starfield / particles", "Scene lighting"]],
    [/sneaker|shoe|product|catalog|shop|store|ecommerce/, ["Product catalog", "Product search", "Filters", "Shopping cart"]],
    [/cart|checkout|payment/, ["Cart", "Checkout flow"]],
    [/wishlist/, ["Wishlist"]],
    [/saas|subscription|pricing|billing/, ["Pricing section", "Product dashboard", "Account settings"]],
    [/crm|customer|pipeline|lead/, ["Customer list", "Pipeline board", "Activity log"]],
    [/kanban|task|project management|roadmap/, ["Project list", "Kanban board", "Task details"]],
    [/portfolio|resume|case/, ["Hero", "Projects grid", "Skills", "Contact"]],
    [/landing|marketing|hero/, ["Hero", "Social proof", "Feature grid", "CTA"]],
    [/auth|login|signup/, ["Authentication"]],
    [/analytics|chart|metric/, ["Analytics widgets"]],
    [/map|location/, ["Map / location"]],
    [/booking|reserv/, ["Reservation / booking"]],
    [/chatbot|chat app|messenger/, ["Chat thread", "Composer"]],
  ];
  const p = String(prompt || "").toLowerCase();
  MAP.forEach(function (pair) {
    if (pair[0].test(p)) pair[1].forEach(function (x) { add(x); });
  });
  words.slice(0, 8).forEach(function (w) {
    if (w.length >= 5) add(titleCaseWords(w) + " module", "Prompt-specific capability");
  });
  if (!out.length) add("Core experience", "Main flow described in the prompt");
  add("Responsive layout", "Works on phone and desktop");
  return out.slice(0, 12);
}

function architectSelfCorrect(brief, prompt) {
  const p = String(prompt || "").toLowerCase();
  const isChatAsk = /chat\s*app|chatbot|ai\s*chat|messaging app|llm playground/.test(p);
  if (brief.type === "chat" && !isChatAsk) {
    brief.type = "website";
    brief.label = "Custom website";
  }
  if (/sneaker|e-?commerce|shop|store/.test(p) && brief.type === "chat") {
    brief.type = "ecommerce"; brief.label = "Ecommerce store";
  }
  if (/(3d|three\.js|webgl|space|galaxy|planet)/.test(p) && brief.type === "chat") {
    brief.type = "space3d"; brief.label = "3D interactive website";
  }
  return brief;
}

function analyzeProjectPrompt(prompt) {
  const raw = String(prompt || "").trim();
  const p = raw.toLowerCase();
  const brief = {
    prompt: raw,
    type: "app",
    label: "Custom application",
    industry: "General",
    audience: "End users",
    goals: [],
    tech: [],
    pages: [],
    features: [],
    components: [],

    database: [],
    assets: ["Logo / mark", "Icons", "Cover imagery"],
    folders: [],
    requirements: [],

  const hit = function () {
    for (let i = 0; i < arguments.length; i++) {
      const term = arguments[i];

        if (term.test(p)) return true;

    brief.type = "chat"; brief.label = "AI chat app"; brief.industry = "Productivity / AI";
  } else if (hit("3d", "three.js", "webgl", "starfield", "planet", "galaxy", "space exploration", "solar system")) {
    brief.type = "space3d"; brief.label = "3D interactive website"; brief.industry = "Space / experience";

    brief.type = "crm"; brief.label = "CRM dashboard"; brief.industry = "Sales operations";
  } else if (hit("project management", "pm tool", "jira", "linear clone")) {
    brief.type = "pm"; brief.label = "Project management SaaS"; brief.industry = "Productivity";

  } else if (hit("login", "auth", "sign in", "signup")) {

  } else if (hit("todo", "task", "kanban", "notes")) {

  } else if (hit("blog", "magazine", "news")) {
    brief.type = "content"; brief.label = "Content site"; brief.industry = "Publishing";
  } else if (hit("fitness", "gym", "workout")) {
    brief.type = "fitness"; brief.label = "Fitness app"; brief.industry = "Health";
  } else if (hit("food delivery", "delivery app", "order food")) {
    brief.type = "delivery"; brief.label = "Food delivery app"; brief.industry = "Food / logistics";
  } else if (hit("social", "instagram", "twitter clone", "feed", "followers")) {
    brief.type = "social"; brief.label = "Social app"; brief.industry = "Social";
  } else if (hit("hotel", "booking", "travel")) {

  } else if (hit("real estate", "property", "listing")) {

// ===================== CONSTRAINT ENGINE =====================
function extractConstraints(prompt) {
  const p = String(prompt || "").toLowerCase();
  const hard = [];
  const prefs = [];
  const constraints = {
    outputMode: "multi", // single-file | multi
    targetFile: null,
    allowedFiles: null, // null = unrestricted
    framework: null, // none | react | vue | vanilla
    dependencies: null, // [] means none allowed
    language: null,
    hard,
    prefs,
  };

  // SINGLE FILE / index.html
  const singleFileHints = [
    /single\s+index\.html/,
    /only\s+index\.html/,
    /one\s+html\s+file/,
    /everything\s+in\s+one\s+file/,
    /all\s+code\s+in\s+(one\s+)?(index\.html|html)/,
    /single\s+html\s+file/,
    /standalone\s+html/,
    /self[-\s]?contained\s+html/,
    /one\s+file\s+only/,
    /single\s+file(\s+project)?/,
    /no\s+separate\s+files/,
    /give\s+(me\s+)?(the\s+)?code\s+in\s+a\s+single\s+index\.html/,
    /in\s+a\s+single\s+index\.html/,
    /single\s+file\s+index\.html/,
  ];
  if (singleFileHints.some((re) => re.test(p)) || (/\bindex\.html\b/.test(p) && /single|only|one\s+file|standalone|self[-\s]?contained/.test(p))) {
    constraints.outputMode = "single-file";
    constraints.targetFile = "index.html";
    constraints.allowedFiles = ["index.html"];
    constraints.framework = "none";
    constraints.dependencies = [];
    constraints.language = "HTML/CSS/JavaScript";
    hard.push("Single file only: index.html");
    hard.push("No framework (vanilla HTML/CSS/JS)");
    hard.push("No additional source files");
  }

  // single main.py
  if (/single\s+(file\s+)?(python|main\.py)/.test(p) || /one\s+file.*main\.py/.test(p) || /main\.py\s+only/.test(p)) {
    constraints.outputMode = "single-file";
    constraints.targetFile = "main.py";
    constraints.allowedFiles = ["main.py"];
    constraints.framework = "none";
    constraints.language = "Python";
    hard.push("Single file only: main.py");
  }

  // explicit no dependencies / vanilla
  if (/no\s+(external\s+)?(dependencies|libraries|frameworks)/.test(p) || /vanilla\s+(js|javascript|html)/.test(p) || /no\s+react/.test(p)) {
    if (constraints.framework !== "none") constraints.framework = "none";
    constraints.dependencies = [];
    hard.push("No external dependencies");
  }

  // explicit React
  if (/\breact\b/.test(p) && constraints.outputMode !== "single-file") {
    constraints.framework = "react";
    constraints.language = constraints.language || "TypeScript/React";
    hard.push("React project structure");
  }

  // preferences
  if (/premium|glass|sleek|modern/.test(p)) prefs.push("Premium / modern visual style");
  if (/responsive|mobile/.test(p)) prefs.push("Responsive layout");
  if (/dark/.test(p)) prefs.push("Dark UI");
  if (/scientific/.test(p)) prefs.push("Scientific functions");
  if (/history/.test(p)) prefs.push("History");

  constraints.hard = hard;
  constraints.prefs = prefs;
  return constraints;
}

function validatePlan(files, constraints) {
  const errors = [];
  if (!constraints) return { ok: true, errors };
  if (constraints.allowedFiles && constraints.allowedFiles.length) {
    const allowed = new Set(constraints.allowedFiles.map((f) => f.toLowerCase()));
    for (const f of files || []) {
      if (!allowed.has(String(f.path).toLowerCase())) {
        errors.push("Forbidden file in plan: " + f.path + " (allowed: " + constraints.allowedFiles.join(", ") + ")");
      }
    }
    for (const a of constraints.allowedFiles) {
      if (!(files || []).some((f) => f.path.toLowerCase() === a.toLowerCase())) {
        errors.push("Required file missing from plan: " + a);
      }
    }
  }
  if (constraints.outputMode === "single-file" && (files || []).length !== 1) {
    errors.push("Single-file mode requires exactly 1 file, got " + (files || []).length);
  }
  return { ok: errors.length === 0, errors };
}

function validateFileOperation(path, constraints) {
  if (!constraints || !constraints.allowedFiles) return { ok: true };
  const allowed = constraints.allowedFiles.map((f) => f.toLowerCase());
  if (!allowed.includes(String(path).toLowerCase())) {
    return { ok: false, reason: "FILE CREATION BLOCKED: " + path + " is not allowed. Allowed: " + constraints.allowedFiles.join(", ") };
  }
  return { ok: true };
}

function formatConstraintsSummary(c) {
  if (!c) return "";
  const lines = [];
  if (c.outputMode === "single-file") lines.push("✓ Single file mode");
  if (c.targetFile) lines.push("✓ Target: " + c.targetFile);
  if (c.framework === "none") lines.push("✓ No framework (vanilla)");
  if (c.dependencies && c.dependencies.length === 0) lines.push("✓ No external dependencies");
  if (c.language) lines.push("✓ Language: " + c.language);
  (c.hard || []).forEach((h) => { if (!lines.some((l) => l.includes(h))) lines.push("✓ " + h); });
  (c.prefs || []).forEach((p) => lines.push("· " + p));
  return lines.join("\n");
}

function planFileManifest(label, prompt, features, design, constraints) {
  const c = constraints || extractConstraints(prompt);
  const on = (id) => (features || []).some((f) => f.id === id && f.on);
  const p = (prompt || "").toLowerCase();
  const files = [];
  const add = (path, purpose) => files.push({ path, purpose, status: "pending" });

  // HARD: single-file mode always wins
  if (c.outputMode === "single-file") {
    const target = c.targetFile || "index.html";
    if (target.endsWith(".html")) {
      add(target, "Complete standalone app (HTML + CSS + JS in one file)");
    } else if (target.endsWith(".py")) {
      add(target, "Complete standalone Python application");
    } else {
      add(target, "Complete standalone single-file application");
    }
    return files;
  }

  // Explicit React or default multi-file when not constrained
  const useReact = c.framework === "react" || (c.framework !== "none" && !c.allowedFiles);

  if (useReact && (/calculat/.test(p) || /calculator/i.test(label))) {
    add("src/App.tsx", "App shell wiring the calculator");
    add("src/components/Calculator.tsx", "Main calculator interface");
    add("src/components/Display.tsx", "Result display");
    add("src/components/Keypad.tsx", "Number and operator buttons");
    add("src/utils/calculatorEngine.ts", "Arithmetic evaluation engine");
    if (on("history")) add("src/utils/history.ts", "Calculation history");
    if (on("scientific")) add("src/components/ScientificPanel.tsx", "Scientific functions panel");
    add("src/styles/calculator.css", "Premium glass calculator styles");
    add("README.md", "Project overview for the calculator");
  } else if (useReact && /website|portfolio|landing|site/.test(p)) {
    add("src/App.tsx", "App shell");
    add("src/components/Hero.tsx", "Hero section");
    add("src/components/Navbar.tsx", "Navigation");
    add("src/components/Footer.tsx", "Footer");
    if (on("contact")) add("src/components/Contact.tsx", "Contact section");
    add("src/styles/site.css", "Site styles");
    add("README.md", "Project overview");
  } else if (useReact && /dashboard|saas/.test(p)) {
    add("src/App.tsx", "Dashboard shell");
    add("src/components/Sidebar.tsx", "Side navigation");
    add("src/components/StatCards.tsx", "Stat cards");
    add("src/styles/dashboard.css", "Dashboard styles");
    add("README.md", "Project overview");
  } else if (useReact) {
    add("src/App.tsx", "Application shell");
    add("src/components/MainView.tsx", "Primary interface");
    add("src/styles/app.css", "Application styles");
    add("README.md", "Project overview");
  } else {
    // vanilla multi without single-file constraint
    add("index.html", "Main HTML document");
    add("styles.css", "Stylesheet");
    add("app.js", "Application logic");
  }

  const validation = validatePlan(files, c);
  if (!validation.ok) {
    console.warn("[NOVA] Plan validation failed, forcing constraint-compliant plan", validation.errors);
    if (c.outputMode === "single-file") {
      return [{ path: c.targetFile || "index.html", purpose: "Constraint-compliant single file", status: "pending" }];
    }
  }
  return files;
}

function computeProgress(job) {
  if (!job || !job.tasks || !job.tasks.length) return 0;
  if (job.status === "COMPLETED") return 100;
  if (job.status === "PLANNING") return 2;
  const n = job.tasks.length;
  const done = job.tasks.filter((t) => t.status === "completed" || t.status === "failed").length;
  const filePct = (done / n) * 80; // 5-85 mapped roughly
  let base = 5 + filePct;
  if (job.phase === "VERIFYING") base = Math.max(base, 88);
  if (job.phase === "PACKAGING") base = Math.max(base, 96);
  if (job.status === "COMPLETED") base = 100;
  return Math.min(99, Math.round(base));
}


function validateGeneratedFile(path, content) {
  const text = String(content || "");
  const size = text.length;
  const lines = text ? text.split(/\n/).length : 0;
  const issues = [];
  if (size < 20) issues.push("file too small (" + size + " bytes)");
  if (!text.trim()) issues.push("empty content");
  const lower = String(path || "").toLowerCase();
  if (lower.endsWith(".html") || lower.endsWith(".htm")) {
    if (!/<html[\s>]/i.test(text) && !/<!DOCTYPE\s+html/i.test(text)) issues.push("missing HTML document structure");
    if (size > 200 && !/<\/html>/i.test(text)) issues.push("missing closing </html>");
  }
  if (lower.endsWith(".json")) {
    try { JSON.parse(text); } catch (e) { issues.push("invalid JSON"); }
  }
  return { ok: issues.length === 0, size: size, lines: lines, issues: issues };
}

async function atomicWriteFile(fs, filePath, content) {
  const text = String(content == null ? "" : content);
  const tmp = filePath + ".__nova_tmp__";
  try {
    if (tmp in fs.files) await fs.writeFile(tmp, text);
    else await fs.createFile(tmp, text);
  } catch (e) {
    fs.files[tmp] = text;
  }
  try {
    if (filePath in fs.files) await fs.writeFile(filePath, text);
    else await fs.createFile(filePath, text);
  } catch (e) {
    fs.files[filePath] = text;
  }
  try { if (tmp in fs.files) delete fs.files[tmp]; } catch (e) {}
  return { path: filePath, size: text.length };
}

    }

  }
  for (let i = 0; i < sections.length; i++) {

          { role: "system", content: sec.system },

        ],
        timeoutMs: NOVA_GEN_TIMEOUT_MS,
        onDelta: function (_c, f) { full = f; },
        onDone: function (f) { full = f || full; }
      });
    } catch (e) {
      if (!full || full.length < 15) throw e;
    }
    var piece = extractFileContent(full, filePath) || String(full || "").trim();
    piece = piece.replace(/^```[\w+-]*\s*\n?/, "").replace(/\n?```\s*$/, "").trim();
    if (!piece || piece.length < 10) {
      var err = new Error("Chunk " + (i + 1) + " (" + sec.title + ") produced no usable content");
      err.code = "CHUNK_EMPTY";
      err.chunk = i + 1;
      throw err;
    }
    parts[sec.id] = piece;
    console.log("[NOVA GEN CHUNK]", { path: filePath, chunk: i + 1, id: sec.id, bytes: piece.length });
  }
  if (typeof onChunkProgress === "function") {
    onChunkProgress({ chunk: sections.length, total: sections.length, title: "package", path: filePath, message: "Packaging project…" });
  }
  var assembled = assembleStandaloneHtml({ title: label, css: parts.css, body: parts.body, js: parts.js });
  if (typeof onChunkProgress === "function") {
    onChunkProgress({ chunk: sections.length, total: sections.length, title: "done", path: filePath, message: "Finalizing files…" });
  }
  return { content: assembled, chunks: sections.length };
}


const UIVERSE_CACHE_KEY = "nova-uiverse-cache-v1";
function loadUiverseCache() {
  try { return JSON.parse(localStorage.getItem(UIVERSE_CACHE_KEY) || "{}"); } catch { return {}; }
}
function saveUiverseCache(map) {
  try { localStorage.setItem(UIVERSE_CACHE_KEY, JSON.stringify(map || {})); } catch {}
}

function extractDesignRequirements(prompt, brief) {
  const p = String(prompt || "").toLowerCase();
  const style = [];
  if (/futur|cyber|sci-?fi|neon/.test(p)) style.push("Futuristic");
  if (/premium|luxury|elegant/.test(p)) style.push("Premium");
  if (/dark|night|black/.test(p)) style.push("Dark theme");
  if (/glass|frost/.test(p)) style.push("Glassmorphism");
  if (/minimal|clean/.test(p)) style.push("Minimal");
  if (/3d|cinematic/.test(p)) style.push("Cinematic depth");
  if (!style.length) style.push("Premium", "Dark graphite", "Glass");
  const sections = [];
  const add = function (s) { if (sections.indexOf(s) < 0) sections.push(s); };
  add("Navbar"); add("Hero"); add("Footer");
  if ((brief && brief.type) === "ecommerce" || /shop|store|sneaker|product/.test(p)) {
    add("Featured products"); add("Product cards"); add("Search"); add("Cart"); add("Mobile navigation");
  }
  if ((brief && brief.type) === "space3d" || /3d|planet|space/.test(p)) {
    add("Scene canvas"); add("HUD"); add("Planet cards");
  }
  if ((brief && brief.type) === "dashboard" || /saas|crm|dashboard/.test(p)) {
    add("Sidebar"); add("KPI widgets"); add("Data table");
  }
  (brief && brief.pages || []).forEach(function (x) { add(x); });
  const components = ["Buttons", "Inputs", "Cards", "Hover states", "Loaders", "Modals"];
  return {
    projectType: (brief && brief.label) || "Website",
    industry: (brief && brief.industry) || "General",
    style: style,
    sections: sections,
    components: components,
    prompt: String(prompt || ""),
  };
}

function novaDesignSystem(reqs) {
  const dark = (reqs.style || []).join(" ").toLowerCase().indexOf("dark") >= 0 || true;
  return {
    theme: (reqs.style || ["Premium Glass"]).join(" · "),
    colors: dark
      ? { bg: "#0b0d11", surface: "#14181f", text: "#e8edf5", muted: "#8b95a7", accent: "#9aa4b2", line: "rgba(255,255,255,0.08)" }
      : { bg: "#f4f6f8", surface: "#ffffff", text: "#12141a", muted: "#5b6573", accent: "#2b313c", line: "rgba(0,0,0,0.08)" },
    typography: ["Sora", "Inter", "Space Grotesk"],
    effects: ["Soft glass panels", "Hairline borders", "Ambient depth", "Short motion 180–280ms", "No cheap neon unless requested"],
    rules: [
      "Do not use default browser buttons or unstyled forms.",
      "Cards need radius, border, and hover elevation.",
      "Navbar sticky with blur.",
      "Mobile: collapse nav, stack grids by 720px.",
      "Focus rings on interactive controls.",
    ],
  };
}

function rankUiverseHit(hit, query) {
  const t = ((hit && (hit.title || hit.name || "")) + " " + (hit && hit.snippet || "")).toLowerCase();
  const q = String(query || "").toLowerCase();
  let s = 20;
  if (/glass|premium|modern|minimal|soft/.test(t)) s += 10;
  if (/animat|hover|transition/.test(t)) s += 8;
  if (/responsive|mobile/.test(t)) s += 8;
  if (/accessib|aria|focus/.test(t)) s += 6;
  if (/dark/.test(t)) s += 6;
  if (q && t.indexOf(q) >= 0) s += 12;
  if (/bootstrap|basic|simple button/.test(t)) s -= 8;
  return Math.max(1, Math.min(50, s));
}

async function discoverUiverseComponents(requirements) {
  const cache = loadUiverseCache();
  const queries = (requirements.components || []).slice(0, 4).map(function (c) {
    return "site:uiverse.io " + c + " " + ((requirements.style || [])[0] || "modern") + " " + (requirements.projectType || "");
  });
  const found = [];
  for (let i = 0; i < queries.length; i++) {
    const q = queries[i];
    if (cache[q] && Array.isArray(cache[q])) {
      cache[q].forEach(function (h) { found.push(h); });
      continue;
    }
    try {
      const rows = await tinyfishSearch(q);
      const mapped = (rows || []).slice(0, 5).map(function (r) {
        return {
          type: q,
          source: /uiverse/i.test(String(r.url || "")) ? "Uiverse" : "Web",
          title: r.title || "UI component",
          url: r.url || "",
          snippet: r.snippet || r.description || "",
          score: rankUiverseHit(r, q),
        };
      });
      cache[q] = mapped;
      mapped.forEach(function (h) { found.push(h); });
    } catch (e) {}
  }
  saveUiverseCache(cache);
  found.sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
  return found.slice(0, 8);
}

function buildDesignContext(requirements, discovered) {
  const ds = novaDesignSystem(requirements);
  const top = (discovered || []).slice(0, 5);
  return {
    requirements: requirements,
    system: ds,
    selected: top,
    fallbackUsed: !top.length,
    updatedAt: Date.now(),
  };
}

function formatDesignContextForPrompt(ctx) {

  if (ctx.selected && ctx.selected.length) {

    ctx.selected.forEach(function (c) {
      lines.push("- " + c.title + (c.url ? (" <" + c.url + ">") : "") + " score " + (c.score || ""));

async function runUiDiscovery(brief, prompt, onProgress) {
  try {
    if (onProgress) onProgress("Reading design requirements…");
    const reqs = extractDesignRequirements(prompt, brief);
    if (onProgress) onProgress("Discovering UI references…");
    const discovered = await discoverUiverseComponents(reqs);
    const ctx = buildDesignContext(reqs, discovered);
    if (onProgress) onProgress(ctx.fallbackUsed ? "Using NOVA design system fallback" : ("Ranked " + ctx.selected.length + " UI references"));
    return ctx;
  } catch (e) {
    return buildDesignContext(extractDesignRequirements(prompt, brief), []);
  }
}


function scoreBand(n) { return Math.max(0, Math.min(10, Math.round(n))); }

function designReviewProject(files, brief, prompt) {
  files = files || {};
  const htmlFiles = Object.keys(files).filter(function (p) { return /\.html?$/i.test(p); });
  const cssFiles = Object.keys(files).filter(function (p) { return /\.css$/i.test(p); });
  const blob = Object.keys(files).map(function (p) { return String(files[p] || ""); }).join("\n");
  const htmlBlob = htmlFiles.map(function (p) { return String(files[p] || ""); }).join("\n") + cssFiles.map(function (p) { return String(files[p] || ""); }).join("\n");
  const issues = [];
  function fail(sev, name, fix) { issues.push({ severity: sev, name: name, fix: fix }); }

  const hasViewport = /<meta[^>]+viewport/i.test(htmlBlob);
  const hasMedia = /@media/i.test(htmlBlob);
  const rawBtn = /<button(?![^>]*class)[^>]*>/i.test(htmlBlob) && !/button\s*\{/i.test(htmlBlob);
  const rawInput = /<input(?![^>]*class)[^>]*>/i.test(htmlBlob) && !/input\s*\{/i.test(htmlBlob);
  const hasHover = /:hover/i.test(htmlBlob);
  const hasFocus = /:focus/i.test(htmlBlob);
  const hasNav = /<nav|navbar|site-header/i.test(htmlBlob);
  const hasHero = /hero|jumbotron|masthead/i.test(htmlBlob);
  const exposed = /nvapi-|sk-or-v1|openrouter|integrate\.api\.nvidia|api key|openai_api/i.test(htmlBlob);
  const placeholder = /\blorem ipsum\b|your-api-key|placeholder\.png|image-placeholder|coming soon\.{3}/i.test(htmlBlob);
  const generic = /welcome to my website|this is a website|click here to get started/i.test(htmlBlob);
  const short = htmlBlob.replace(/\s+/g, " ").length < 800;
  const noDoctype = htmlFiles.length && htmlFiles.every(function (p) { return !/<!DOCTYPE html>/i.test(String(files[p] || "")); });

  if (!hasViewport) fail("high", "Missing viewport meta", "Add responsive viewport meta.");
  if (!hasMedia) fail("high", "No mobile breakpoints", "Add @media rules for 320/375/768.");
  if (rawBtn) fail("high", "Unstyled buttons", "Style buttons with padding, radius, hover.");
  if (rawInput) fail("high", "Unstyled inputs", "Style inputs with focus rings and padding.");
  if (!hasHover) fail("medium", "Missing hover states", "Add :hover for links, cards, buttons.");
  if (!hasFocus) fail("medium", "Missing focus states", "Add :focus-visible outlines.");
  if (exposed) fail("high", "Exposed provider/settings", "Remove API keys and vendor settings from the UI.");
  if (placeholder) fail("medium", "Placeholder graphics/copy", "Replace lorem/placeholder assets.");
  if (generic) fail("medium", "Generic template copy", "Write product-specific copy from the prompt.");
  if (short) fail("high", "Thin / unfinished page", "Generate a complete layout, not a stub.");
  if (noDoctype) fail("low", "Missing doctype", "Start HTML with <!DOCTYPE html>.");
  const type = (brief && brief.type) || "";
  if (type === "chat" || /chat app|chatbot/.test(String(prompt || "").toLowerCase())) {
    if (exposed) fail("high", "Chat app exposes engine settings", "Consumer chat UI only — no provider panels.");
    if (!/histor|thread|sidebar/i.test(htmlBlob)) fail("medium", "No conversation history chrome", "Add a thread list / sidebar.");
  }
  if (type === "website" || type === "landing" || type === "ecommerce" || type === "portfolio") {
    if (!hasHero) fail("medium", "Weak or missing hero", "Add a strong first-screen hero.");
    if (!hasNav) fail("medium", "Generic/missing navbar", "Add a real product navbar.");
  }

  const visual = scoreBand(10 - (generic ? 3 : 0) - (placeholder ? 3 : 0) - (short ? 4 : 0));
  const layout = scoreBand(10 - (short ? 4 : 0) - (noDoctype ? 1 : 0) - (!hasNav ? 2 : 0));
  const responsive = scoreBand((hasViewport ? 5 : 1) + (hasMedia ? 5 : 1));
  const a11y = scoreBand((hasFocus ? 5 : 2) + (/aria-|alt=/i.test(htmlBlob) ? 4 : 1));
  const consistency = scoreBand(hasHover && !rawBtn ? 8 : 4);
  const professional = scoreBand(10 - (exposed ? 6 : 0) - (generic ? 3 : 0) - (rawBtn ? 2 : 0));
  const interaction = scoreBand((hasHover ? 5 : 2) + (hasFocus ? 3 : 1));
  const performance = scoreBand(/<img/i.test(htmlBlob) && !/loading=["']lazy/.test(htmlBlob) ? 6 : 8);
  const scores = {
    visual: visual, layout: layout, responsive: responsive, a11y: a11y,
    consistency: consistency, professional: professional, interaction: interaction, performance: performance,
  };
  const total = visual + layout + responsive + a11y + consistency + professional + interaction + performance;
  const autoFail = issues.some(function (x) { return x.severity === "high"; }) && total < 70;
  const passed = total >= 65 && !exposed && !short;
  return {
    scores: scores,
    total: total,
    max: 80,
    passed: passed && !autoFail,
    issues: issues,
    mobile: {
      "320": hasMedia && hasViewport,
      "375": hasMedia && hasViewport,
      "768": hasMedia,
      "1024": true,
      "1440": true,
    },
  };
}

function formatReviewForPrompt(review) {
  if (!review) return "";
  const lines = ["DESIGN REVIEW " + (review.passed ? "PASS" : "REJECT") + " " + review.total + "/80"];
  Object.keys(review.scores || {}).forEach(function (k) {
    lines.push(k + ": " + review.scores[k] + "/10");
  });
  (review.issues || []).forEach(function (i) {
    lines.push("- [" + i.severity + "] " + i.name + " → " + i.fix);
  });
  return lines.join("\n");
}

  const user = "User request:\n" + (prompt || "") + "\n\nCurrent file " + target + ":\n" + current.slice(0, 24000) + "\n\nApply the review fixes. Production-grade UI.";

async function generateOneFile(aiClient, { path, purpose, projectLabel, prompt, design, features, existingPaths, constraints, research, designContext }) {
  const feat = (features || []).filter((f) => f.on).map((f) => f.label).join(", ");

    "You are NOVA's file generation worker.",
    "Generate ONLY the content for ONE file. No explanations before or after.",
    "Preferred format:",
    "@@@FILE:" + path,
    "...full file content...",
    "@@@END",

      ? ("HARD CONSTRAINT: Single-file project. Output path MUST be " + path + ". Include complete HTML5 with embedded <style> and <script>. No React, no imports, no other files.")
      : ("Use TypeScript/React when appropriate. Design: " + (design || "Premium Glass") + "."),

    formatDesignContextForPrompt(designContext),
    "Use current best practices. Accessible, responsive, production-quality UI. Never generic Bootstrap-looking chrome.",
  ].filter(Boolean).join("\n");
  const user = [

    "Features: " + feat,
    "File to generate: " + path,
    "Purpose: " + purpose,
    single ? "Return the complete standalone file only." : ("Other planned files: " + (existingPaths || []).join(", ")),
  ].join("\n");

  let full = "";

      messages: [

        { role: "user", content: user },
      ],
      timeoutMs: NOVA_GEN_TIMEOUT_MS,
      onDelta: (_c, f) => { full = f; },
      onDone: (f) => { full = f || full; },
    });
  } catch (e) {
    if (!full || full.length < 20) throw e;
  }

  console.log("[NOVA GEN]", { path: path, responseChars: (full || "").length, preview: String(full || "").slice(0, 120) });

  let content = extractFileContent(full, path);

  if ((!content || content.length < 10) && single && (full || "").length > 80) {
    let salvage = String(full);
    const htmlAt = salvage.search(/<!DOCTYPE\s+html|<html[\s>]/i);
    if (htmlAt >= 0) salvage = salvage.slice(htmlAt);
    salvage = salvage.replace(/^```[\w+:-]*[ \t]*\n?/, "").replace(/\n?```\s*$/, "").trim();
    if (salvage.length > 40) content = salvage;
  }

  if (!content || content.length < 10) {
    const err = new Error("AI response received, but file extraction failed for " + path + " (got " + (full || "").length + " chars).");
    err.code = "EXTRACT_FAILED";
    err.rawPreview = String(full || "").slice(0, 240);
    throw err;
  }
  console.log("[NOVA GEN]", { path: path, extractedChars: content.length, status: "ok" });
  return content;
}

                  <button key={d} type="button" onClick={() => setDesign(d)}

                  <div className="text-[10px] text-slate-500 uppercase">Pages</div>

                </div>
                <div>
                  <div className="text-[10px] text-slate-500 uppercase">Components</div>
                  <div>{(brief.components || []).join(" · ") || "—"}</div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-500 uppercase">APIs</div>
                  <div>{(brief.apis && brief.apis.length) ? brief.apis.join(" · ") : "None required (local / static)"}</div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-500 uppercase">Data</div>
                  <div>{(brief.database && brief.database.length) ? brief.database.join(" · ") : "No remote database"}</div>

                  <div className="text-[10px] text-slate-500 uppercase">Folders</div>
                  <div className="font-mono text-[10px] text-slate-400">{(brief.folders || []).join("  ")}</div>

              </div>

            <div className="glass-soft rounded-xl p-4 text-xs text-slate-300 space-y-1">

              {(brief && brief.plan ? brief.plan : ["Implement selected features", "Polish", "Verify"]).map((step, i) => (
                <div key={i}>{i + 1}. {step}</div>
              ))}
            </div>
            <div className="text-[11px] text-slate-400">Features selected: {(features || []).filter((f) => f.on).length}</div>
            {buildBlockedReason ? (
              <div className="text-[11px] text-amber-300/90">{buildBlockedReason}</div>
            ) : (
              <div className="text-[11px] text-slate-500">Plan is ready. Build writes files into this project.</div>

            {buildError && (
              <div className="text-[11px] text-rose-300">{buildError} <button type="button" className="underline" onClick={onStartBuild}>Retry Build</button></div>

              <button type="button" onClick={() => setStage("features")} className="px-3 py-2 rounded-xl glass-soft text-xs">← Modify</button>

                {isBuilding ? "Building…" : "Build project →"}
              </button>
            </div>
          </div>
        )}
        {(stage === "review" || stage === "refine") && (
          <div className="max-w-lg mx-auto space-y-3">
            <div className="text-sm font-medium">{stage === "refine" ? "Refining UI" : "Design review"}</div>
            <div className="text-xs text-slate-400">{review ? ((review.passed ? "PASS" : "REJECT") + " · " + review.total + "/80") : "Scoring generated UI…"}</div>
            {review && (
              <div className="grid grid-cols-2 gap-2 text-[10px] text-slate-400">
                <div>Visual {review.scores && review.scores.visual}/10</div>
                <div>Layout {review.scores && review.scores.layout}/10</div>
                <div>Responsive {review.scores && review.scores.responsive}/10</div>
                <div>A11y {review.scores && review.scores.a11y}/10</div>
                <div>Consistency {review.scores && review.scores.consistency}/10</div>
                <div>Professional {review.scores && review.scores.professional}/10</div>
              </div>

                <div key={i} className="text-[11px] text-slate-400">{l.done ? "✓" : "●"} {l.text}</div>
              ))}
            </div>
          </div>
        )}
        {(stage === "build" || stage === "verify") && (
          <div className="max-w-lg mx-auto space-y-3">
            <div className="text-sm font-medium">{stage === "build" ? "Building your project" : "Verifying"}</div>
            <div className="space-y-1.5 text-xs">
              {(buildLog || []).map((line, i) => (
                <div key={i} className="flex gap-2 text-slate-300">
                  <span className={line.done ? "text-emerald-400" : "text-cyan-300"}>{line.done ? "✓" : "●"}</span>
                  {line.text}
                </div>
              ))}
            </div>
          </div>
        )}
        {stage === "preview" && (
          <div className="h-full flex flex-col min-h-0 gap-3">
            <div className="flex items-center gap-2 text-xs">
              <span className="text-emerald-400">✓</span>
              <span className="font-medium">Project ready</span>
              <span className="text-slate-500">— try it below, then ask NOVA to improve it in chat</span>
            </div>
            <div className="flex-1 min-h-[280px] glass-soft rounded-xl overflow-hidden border border-white/10">
              {previewHtml ? (
                <iframe title="preview" className="w-full h-full bg-black/40" sandbox="allow-scripts" srcDoc={previewHtml} />
              ) : (
                <div className="h-full flex items-center justify-center text-slate-500 text-sm">Preview unavailable — open Developer Mode</div>
              )}
            </div>
            <div className="flex flex-wrap gap-2 text-[11px]">
              <button type="button" className="px-3 py-1.5 rounded-lg glass-soft" onClick={() => window.dispatchEvent(new CustomEvent("nova-quick-prompt", { detail: "Make the design more premium" }))}>Improve design</button>
              <button type="button" className="px-3 py-1.5 rounded-lg glass-soft" onClick={() => window.dispatchEvent(new CustomEvent("nova-quick-prompt", { detail: "Make it more mobile friendly" }))}>More mobile friendly</button>
              <button type="button" className="px-3 py-1.5 rounded-lg glass-soft" onClick={onOpenDev}>View code</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function collectProjectText(files) {
  const parts = [];
  Object.keys(files || {}).forEach(function (p) {
    parts.push(p + "\n" + String(files[p] || "").slice(0, 4000));
  });
  return parts.join("\n").toLowerCase();
}

function inferPlanner(projectMeta, files, brief, features, messages) {
  const text = collectProjectText(files);
  const paths = Object.keys(files || {});
  const feats = (features && features.length ? features : (brief && brief.features) || []).slice();
  const tasks = [];

  function addTask(label, opts) {
    opts = opts || {};
    const id = slugId(label);
    if (tasks.some(function (t) { return t.id === id; })) return;
    const needles = (opts.needles || [label]).map(function (n) { return String(n).toLowerCase(); });
    const found = needles.some(function (n) { return n.length > 2 && text.indexOf(n) >= 0; });
    tasks.push({
      id: id,
      label: label,
      detail: opts.detail || "",
      status: found ? "COMPLETED" : (opts.status || "TODO"),
      priority: opts.priority || "MEDIUM",
      source: opts.source || "AI GENERATED",
      files: opts.files || [],
      phase: opts.phase || "Build",
    });
  }

  addTask("Project setup", { needles: ["project.json"], phase: "Setup", priority: "HIGH", status: paths.length ? "COMPLETED" : "TODO" });
  addTask("Folder structure", { needles: ["src/", "components/"], phase: "Setup", priority: "MEDIUM" });

  feats.forEach(function (f, i) {
    const label = f.label || f;
    addTask(label, {
      detail: f.desc || "",
      needles: [label, (f.id || "")],
      phase: i < 3 ? "Foundation" : i < 6 ? "Core" : "Growth",
      priority: f.on === false ? "LOW" : (i < 3 ? "HIGH" : "MEDIUM"),
      source: "AI GENERATED",
    });
  });

  if (brief && brief.pages) {
    brief.pages.forEach(function (pg) {
      addTask(pg + " page", { needles: [pg], phase: "Pages", priority: "HIGH" });
    });
  }

  // prompt leftovers
  const lastUser = (messages || []).filter(function (m) { return m.role === "user"; }).slice(-1)[0];
  if (lastUser && lastUser.content) {
    addTask("Honor latest request", { detail: String(lastUser.content).slice(0, 140), needles: [], phase: "Alignment", priority: "HIGH", status: "IN PROGRESS" });
  }

  const bugs = [];
  const htmlFiles = paths.filter(function (p) { return /\.html?$/i.test(p); });
  htmlFiles.forEach(function (p) {
    const c = String(files[p] || "");
    if (c.length < 40) bugs.push({ name: "Empty or stub file", severity: "High", file: p, fix: "Regenerate a complete page." });
    if (c && !/<meta[^>]+viewport/i.test(c)) bugs.push({ name: "Missing viewport meta", severity: "Medium", file: p, fix: "Add responsive viewport meta tag." });
    if (c && /<img /i.test(c) && !/alt=/i.test(c)) bugs.push({ name: "Images missing alt text", severity: "Medium", file: p, fix: "Add alt attributes for accessibility." });
    if (c && !/<!DOCTYPE html>/i.test(c) && /<html/i.test(c)) bugs.push({ name: "Missing doctype", severity: "Low", file: p, fix: "Start the document with <!DOCTYPE html>." });
  });
  paths.forEach(function (p) {
    if (/\.(tsx?|jsx?)$/i.test(p) && /from ['\"][^'\"]+['\"]/.test(String(files[p]||""))) {
      const m = String(files[p]||"").match(/from ['\"](\.[^'\"]+)['\"]/g);
      (m || []).forEach(function () { /* local imports — skip hard fail */ });
    }
  });

  const improvements = [];
  if (text.indexOf("prefers-reduced-motion") < 0) improvements.push("Respect reduced-motion for animations");
  if (text.indexOf("meta name=\"description\"") < 0 && text.indexOf("meta name='description'") < 0) improvements.push("Add SEO description metadata");
  if (text.indexOf("loading=\"lazy\"") < 0) improvements.push("Lazy-load images");
  if (text.indexOf("aria-") < 0) improvements.push("Add ARIA labels on interactive controls");
  if (text.indexOf("dark") < 0) improvements.push("Consider a dark-mode variant");
  improvements.push("Tighten spacing and type scale on mobile");

  const completed = tasks.filter(function (t) { return t.status === "COMPLETED"; }).length;
  const remaining = tasks.length - completed;
  const pct = tasks.length ? Math.round((completed / tasks.length) * 100) : 0;

  const milestones = [
    { name: "Project setup", pct: paths.length ? 100 : 0 },
    { name: "Frontend complete", pct: Math.min(100, pct) },
    { name: "Quality pass", pct: Math.max(0, pct - 25) },
    { name: "Production ready", pct: Math.max(0, pct - 45) },
  ];

  const health = Math.max(20, Math.min(96,
    55 + Math.round(pct * 0.3) - bugs.length * 4 + (htmlFiles.length ? 6 : 0)
  ));

  const phases = {};
  tasks.forEach(function (t) {
    phases[t.phase] = phases[t.phase] || [];
    phases[t.phase].push(t);
  });

  let status = "Planning";
  if (pct >= 90) status = "Completed";
  else if (pct >= 55) status = "Testing";
  else if (pct >= 20) status = "Building";

  return {
    tasks: tasks,
    bugs: bugs,
    improvements: improvements.slice(0, 6),
    milestones: milestones,
    phases: phases,
    progress: { pct: pct, completed: completed, remaining: remaining, total: tasks.length },
    health: health,
    status: status,
    analyzedAt: Date.now(),
  };
}

        if (t.find((x) => x.path === path)) return t;
        return [...t, { path, content, dirty: false }];
      });
      setActivePath(path);
    } catch (e) { toast(e.message, "err"); }
  };

  const activeTab = tabs.find((t) => t.path === activePath);
  const updateContent = (v) => {
    setTabs((t) => t.map((x) => x.path === activePath ? { ...x, content: v, dirty: true } : x));
  };
  const saveActive = async () => {
    if (!activeTab) return;
    await fs.writeFile(activeTab.path, activeTab.content);
    setTabs((t) => t.map((x) => x.path === activePath ? { ...x, dirty: false } : x));
    refreshTree();
    refreshGit();
    toast("Saved " + activeTab.path);
  };

  useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "s") {
        e.preventDefault();
        saveActive();
      }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [activePath, tabs]);

  const addActivity = (text) => setActivity((a) => [...a, { t: new Date().toLocaleTimeString(), text }]);


  const runCommand = async (executable, args, { approved } = {}) => {
    const result = await executionManager.execute({ executable, args, approved });
    if (result.needsApproval) {
      setPendingApproval({
        summary: `Run ${executable} ${(args || []).join(" ")}?`,
        policy: result.policy,
      });
      pendingAction.current = async () => {
        setPendingApproval(null);
        await executionManager.execute({ executable, args, approved: true }, { skipApprovalCheck: true });
      };
      return result;
    }
    return result;
  };

  // ---- Live AI chat (OpenAI-compatible via proxy) ----
  const runLiveAI = async (text, opts = {}) => {
    const allowFiles = opts.allowFiles !== false;
    const mode = opts.mode || (allowFiles ? "modify" : "chat");
    const cfg = loadAIConfig();
    const errs = aiClient.validateConfig(cfg);
    if (errs.length) {
      toast(errs[0], "err");
      setMessages((m) => [...m, {
        id: uid(), role: "assistant", content: errs[0], timestamp: now(), status: "error",
      }]);
      return;
    }

    const assistantId = uid();
    setMessages((m) => [...m, {
      id: assistantId, role: "assistant", content: "",
      displayContent: allowFiles ? "Updating project files…" : "",
      timestamp: now(), status: "streaming",
    }]);
    setStreaming(true);
    setAgentStatus("GENERATING");
    addActivity("Streaming from " + (NOVA_BRAND.modelName));

    const history = [];
    const prior = messages.filter((x) => x.role === "user" || (x.role === "assistant" && x.status === "complete"));
    prior.slice(-10).forEach((x) => {
      const c = x.role === "assistant" ? (x.displayContent || stripFileBlocks(x.content) || "") : x.content;
      if (c && c.length < 8000) history.push({ role: x.role, content: c });
    });
    history.push({ role: "user", content: text });

    let fileContent = "";
    if (activePath) {
      try {
        const raw = await fs.readFile(activePath);
        fileContent = String(raw).slice(0, 8000);
      } catch {}
    }
    const paths = Object.keys(fs.files || {});
    const treeSample = paths.slice(0, 60).join(", ");
    let allFilesBrief = "";
    if (allowFiles && paths.length) {
      const picks = paths.slice(0, 4);
      const parts = [];
      for (const p of picks) {
        try {
          const raw = await fs.readFile(p);
          parts.push("--- " + p + " ---\n" + String(raw).slice(0, 2500));
        } catch {}
      }
      allFilesBrief = parts.join("\n\n");
    }

    const persisted = loadProjectConstraints();
    const constraints = opts.constraints || wsConstraints || persisted || null;

    const sys = NOVA_SYSTEM_PROMPT({
      mode: mode,
      project: fs.name,
      file: activePath || "",
      tree: treeSample,
      fileContent: fileContent,
      allFilesBrief: allFilesBrief,
      constraints: constraints,
    });

    const controller = new AbortController();
    abortRef.current = controller;

    try {
      const fullText = await aiClient.streamChat({
        messages: [{ role: "system", content: sys }, ...history],
        signal: controller.signal,
        onDelta: (_chunk, full) => {
          const preview = allowFiles
            ? (sanitizeChatDisplay(full, { allowFiles: true }) || "Updating project files…")
            : (sanitizeChatDisplay(full) || "…");
          setMessages((m) => m.map((x) => x.id === assistantId ? {
            ...x,
            content: full,
            displayContent: preview,
            status: "streaming",
          } : x));
        },
        onDone: async (full) => {
          let blocks = allowFiles ? parseFileBlocks(full) : [];
          if (constraints && constraints.outputMode === "single-file" && blocks.length) {
            const target = constraints.targetFile || "index.html";
            blocks = blocks.filter((b) => b.path === target || String(b.path || "").endsWith("/" + target));
            if (!blocks.length) {
              const salvaged = extractFileContent(full, target);
              if (salvaged && salvaged.length > 20) blocks = [{ path: target, content: salvaged }];
            }
          } else if (allowFiles && !blocks.length) {
            const htmlFiles = paths.filter((p) => /\.html?$/i.test(p));
            if (htmlFiles.length === 1) {
              const salvaged = extractFileContent(full, htmlFiles[0]);
              if (salvaged && salvaged.length > 20) blocks = [{ path: htmlFiles[0], content: salvaged }];
            }
          }

          let fileActions = [];
          if (allowFiles && blocks.length) {
            addActivity("Writing " + blocks.length + " file(s) to workspace");
            fileActions = await applyFileBlocksToFS(fs, blocks);
            fileActions = fileActions.map((fa) => {
              const size = ((fs.files && fs.files[fa.path]) || "").length;
              return Object.assign({}, fa, { size: size, ok: !!(fa.ok && size > 0) });
            });
            refreshTree();
            try { refreshGit(); } catch (e) {}
            const okFiles = fileActions.filter((f) => f.ok);
            if (okFiles.length === 1) {
              try { await openFile(okFiles[0].path); } catch (e) {}
            }
            if (constraints) saveProjectConstraints(constraints);
            toast(okFiles.length ? ("Updated " + okFiles.length + " file(s)") : "File write failed");
          }

          const okPaths = fileActions.filter((f) => f.ok).map((f) => f.path);
          let display = sanitizeChatDisplay(full, {
            allowFiles: allowFiles,
            fileCount: okPaths.length,
            paths: okPaths,
          });
          if (!display) {
            display = okPaths.length
              ? ("**Updated files**\n\n" + okPaths.map((p) => "• `" + p + "`").join("\n") + "\n\nUse **Download** on the cards below.")
              : (allowFiles
                ? "I could not extract structured file updates. Try a clearer change request — source code is never printed in chat."
                : (sanitizeChatDisplay(full) || "Done."));
          }

          setMessages((m) => m.map((x) => x.id === assistantId ? {
            ...x,
            content: full,
            displayContent: display,
            fileActions: fileActions,
            status: "complete",
          } : x));
          setConnStatus(loadConnStatus());
          addActivity(okPaths.length ? ("Files updated: " + okPaths.join(", ")) : "Response complete");
        },
        onError: (err) => {
          setMessages((m) => m.map((x) => x.id === assistantId ? {
            ...x,
            content: (x.content || "") + (x.content ? "\n\n" : "") + ("Error: " + err.message),
            displayContent: (x.displayContent || "") + (x.displayContent ? "\n\n" : "") + ("Error: " + err.message),
            status: err.code === "CANCELLED" ? "cancelled" : "error",
          } : x));
          setConnStatus(loadConnStatus());
        },
      });
      void fullText;
      setAgentStatus("IDLE");
    } catch (e) {
      setAgentStatus(e.code === "CANCELLED" ? "IDLE" : "ERROR");
      if (e.code !== "CANCELLED") toast(e.message, "err");
    } finally {
      setStreaming(false);
      abortRef.current = null;
      setAgentStatus("IDLE");
    }
  };

  const handleStop = () => {
    genCancelRef.current = true;
    if (abortRef.current) abortRef.current.abort();
    aiClient.cancel();
    setStreaming(false);
    setAgentStatus("IDLE");
    setGenJob((j) => {
      if (!j) return j;
      const n = { ...j, status: "CANCELLED", phase: "CANCELLED" };
      saveGenJob(n);
      return n;
    });
    addActivity("Generation stopped — completed files kept");
    toast("Stopped. Completed files remain in the project.");
  };
  useEffect(() => {
    const h = (e) => {
      const q = e && e.detail;
      if (typeof q === "string" && q.trim()) handleAgent(q.trim());
    };
    window.addEventListener("nova-quick-prompt", h);
    return () => window.removeEventListener("nova-quick-prompt", h);
  });


  const handleAgent = async (text) => {
    const userMsg = { id: uid(), role: "user", content: text, timestamp: now(), status: "complete" };
    setMessages((m) => [...m, userMsg]);

    const lower = text.toLowerCase();
    const isBuildIntent = /\b(create|build|make|generate)\b/.test(lower) && !/^__NOVA_GEN__/i.test(text);
    const isModifyIntent = /\b(make|change|update|add|fix|improve|resize|bigger|smaller|dark|theme)\b/.test(lower) && currentTask;

    // ---- IMMEDIATE shared task (chat + workspace same source of truth) ----
    // Do this BEFORE any await so HOME leaves on the same interaction.
    const taskId = uid();
    const task = {
      id: taskId,
      userPrompt: text,
      status: "UNDERSTANDING",
      stage: isBuildIntent ? "understand" : (isModifyIntent ? "understand" : "understand"),
      createdAt: now(),
    };
    setCurrentTask(task);
    setCenterMode("ai");
    setWsPrompt(text);
    setWsStage("understand");
    setAgentStatus("ANALYZING");

    // PLANNING ONLY — never generate source code before BUILD
    if (isBuildIntent && !["build", "verify", "preview"].includes(wsStage)) {
      setCenterMode("ai");
      setWsPrompt(text);
      const det = detectAppType(text);
      const brief = analyzeProjectPrompt(text);
      const constraints = extractConstraints(text);
      setWsConstraints(constraints);
      saveProjectConstraints(constraints);
      setWsLabel(brief.label);
      setWsBrief(brief);
      setWsStage("understand");
      let summary =
        "UNDERSTANDING\nDetected: **" + brief.label + "**\nIndustry: " + brief.industry + "\nAudience: " + brief.audience +
        "\nPages: " + (brief.pages || []).join(", ") +
        "\n\nFEATURES\n" + (brief.features || []).filter(function (f) { return f.on; }).map(function (f) { return "✓ " + f.label; }).join("\n") +
        "\n\nPLAN\n" + (brief.components || []).length + " components · " + (brief.pages || []).length + " pages";
      if (constraints.outputMode === "single-file") {
        summary += "\n\nConstraint: entire product stays in **" + (constraints.targetFile || "index.html") + "**.";
      }
      setWsSummary(summary);
      setWsFeatures(brief.features);
      setWsResearch({ status: "running", log: ["Understanding request…"] });
      setWsStage("research");
      const research = await runTinyFishResearch(brief, text, function (msg) {
        setWsResearch(function (prev) {
          const log = ((prev && prev.log) || []).concat([msg]);
          return Object.assign({}, prev || {}, { status: "running", log: log });
        });
      });
      setWsResearch(Object.assign({}, research, { log: (research && research.status === "error") ? ["Research unavailable: " + (research.error || "")] : ["Research complete"] }));
      const designContext = await runUiDiscovery(brief, text, function (msg) {
        setWsResearch(function (prev) {
          const log = ((prev && prev.log) || []).concat([msg]);
          return Object.assign({}, prev || {}, { log: log });
        });
      });
      brief.research = research;
      brief.designContext = designContext;
      setWsBrief(brief);
      await sleep(300);
      setWsStage("confirm");
      setCurrentTask((t) => t && t.id === taskId ? { ...t, stage: "confirm", status: "CONFIRMATION" } : t);
      const planned = planFileManifest(brief.label, text, brief.features, "Premium Glass", constraints);
      const v = validatePlan(planned, constraints);
      const constraintBlock = formatConstraintsSummary(constraints);
      setMessages((m) => [...m, {
        id: uid(), role: "assistant", status: "complete", timestamp: now(),
        displayContent: summary + "\n\n" +
          (constraintBlock ? ("**Requirements**\n" + constraintBlock + "\n\n") : "") +
          "Next: pick features and review the plan. **No source code until you click Build Project.**\n\n" +
          "**Files planned (" + planned.length + ")**\n" + planned.map((f) => "• " + f.path + " — " + f.purpose).join("\n") +
          (v.ok ? "" : ("\n\n⚠ Plan adjusted for constraints.")),
        content: "Planning only — no code generated.",
      }]);
      setAgentStatus("IDLE");
      setStreaming(false);
      return; // HARD STOP: no runLiveAI
    }

    // During active generation, ignore free-form prompts that would dump code
    if (genJob && (genJob.status === "BUILDING" || genJob.status === "VERIFYING")) {
      setMessages((m) => [...m, {
        id: uid(), role: "assistant", status: "complete", timestamp: now(),
        displayContent: "Generation is in progress. Use **Stop** to cancel, or wait for the build to finish.",
        content: "busy",
      }]);
      return;
    }

    const isToolIntent = /git status|initialize git|run (the )?build|fix so it builds|source control|commit message|npm run/.test(lower);

    // Chat / modify via configured AI provider — never dump code in chat for project work
    if (aiConfigured && !isToolIntent) {
      setWsStage((s) => (s === "idle" ? "understand" : s));
      const hasProjectFiles = Object.keys(fs.files || {}).length > 0;
      const modifyRe = /(upgrade|update|modify|change|add|fix|improve|redesign|refactor|resize|bigger|smaller|dark|theme|feature|bug|login|navbar|animation|responsive|edit)/i;
      const isModify = modifyRe.test(text) || hasProjectFiles;
      let constraints = wsConstraints || loadProjectConstraints() || null;
      if (!constraints && hasProjectFiles) {
        const keys = Object.keys(fs.files);
        if (keys.length === 1 && /\.html?$/i.test(keys[0])) {
          constraints = { outputMode: "single-file", targetFile: keys[0], framework: "none" };
        }
      }
      if (constraints) {
        setWsConstraints(constraints);
        saveProjectConstraints(constraints);
      }
      await runLiveAI(text, {
        allowFiles: isModify,
        mode: isModify ? "modify" : "chat",
        constraints: constraints,
      });
      setCurrentTask((t) => t && t.id === taskId ? { ...t, status: "READY" } : t);
      setAgentStatus("IDLE");
      return;
    }

    // Local/simulated tool paths (Phase 3–5) when AI offline or explicit tool intents
    setAgentStatus("ANALYZING");
    addActivity("Analyzing request…");

    if (/git status|source control|what changed/.test(lower)) {
      const st = git.status();
      setMessages((m) => [...m, {
        id: uid(), role: "assistant", timestamp: now(), status: "complete",
        content: st.initialized
          ? `On branch ${st.branch}. Staged: ${st.staged.length}, unstaged: ${st.unstaged.length}. Ahead: ${st.ahead}.`
          : "No git repository. Initialize from Source Control when ready.",
      }]);
      setAgentStatus("IDLE");
      return;
    }
    if (/commit/.test(lower) && /suggest|message|prepare/.test(lower)) {
      const st = git.status();
      const suggestion = git.suggestCommitMessage([...st.staged, ...st.unstaged]);
      setMessages((m) => [...m, { id: uid(), role: "assistant", status: "complete", content: `Suggested commit message:\n\n"${suggestion}"\n\nStage files and confirm in Source Control. I will not commit without your approval.`, timestamp: now() }]);
      setAgentStatus("IDLE");
      return;
    }
    if (/init(ialize)? (git|repo)/.test(lower)) {
      setPendingApproval({ summary: "Initialize Git repository for this workspace?" });
      pendingAction.current = async () => {
        git.init();
        refreshGit();
        setPendingApproval(null);
        setMessages((m) => [...m, { id: uid(), role: "assistant", status: "complete", content: "Repository initialized (simulated). Initial commit created on main.", timestamp: now() }]);
        addActivity("git init completed");
      };
      setAgentStatus("WAITING");
      return;
    }
    if (/build|fix so it builds|run (the )?build/.test(lower)) {
      setCheckpoint(git.checkpoint());
      setAgentStatus("EXECUTING");
      const result = await runCommand("npm", ["run", "build"]);
      if (result.needsApproval) { setAgentStatus("WAITING"); return; }
      setMessages((m) => [...m, {
        id: uid(), role: "assistant", status: "complete", timestamp: now(),
        content: result.success
          ? "Build command completed successfully (exit 0)."
          : "Build failed with exit code " + result.exitCode + ". See terminal.",
      }]);
      setAgentStatus("IDLE");
      return;
    }

    // If AI configured, fall through to live model for everything else
    if (aiConfigured) {
      await runLiveAI(text);
      return;
    }

    setMessages((m) => [...m, {
      id: uid(), role: "assistant", status: "complete", timestamp: now(),
      content: "Configure AI in Settings (API Key, Model, Base URL) for live responses.\n\nWithout AI I can still help with git status, builds (simulated), and workspace tools.",
    }]);
    setAgentStatus("IDLE");
  };

  const onApprove = async () => {
    if (pendingAction.current) await pendingAction.current();
    pendingAction.current = null;
    setAgentStatus("IDLE");
  };
  const onReject = () => {
    pendingAction.current = null;
    setPendingApproval(null);
    addActivity("Change rejected — no modifications");
    setMessages((m) => [...m, { id: uid(), role: "assistant", status: "complete", content: "Rejected. No files or git state were changed.", timestamp: now() }]);
    setAgentStatus("IDLE");
  };

  const saveSettings = (form) => {
    const next = saveAIConfig(form);
    setAiConfig(next);
    const errs = aiClient.validateConfig(next);
    if (errs.length) {
      toast(errs[0], "err");
      return;
    }
    toast("AI settings saved");
    setNav("agent");
  };

  const testConnection = async (form) => {
    // save first so client picks up values
    const next = saveAIConfig(form);
    setAiConfig(next);
    setTestingConn(true);
    addActivity("Testing AI connection…");
    const result = await aiClient.testConnection();
    setConnStatus(loadConnStatus());
    setTestingConn(false);
    if (result.ok) toast("✓ AI connection successful");
    else toast(result.error || "Connection failed", "err");
  };

  const resetAI = () => {
    if (!confirm("Clear AI API key, model, base URL, and proxy?")) return;
    const next = saveAIConfig(defaultAIConfig());
    setAiConfig(next);
    saveConnStatus({ state: "unknown" });
    setConnStatus({ state: "unknown" });
    toast("AI settings reset");
  };

  return (
    <div className="h-full w-full flex relative">
      <Sidebar active={nav} onNav={(id) => {
        setNav(id);
        if (id === "dashboard" || id === "settings") setProjectOpen(false);
        if (id === "workspace") {
          if (currentProjectId) setProjectOpen(true);
          else setProjectOpen(false);
        }
      }} gitStatus={gitStatus} />
      <NewProjectModal open={showNewProject} onClose={() => setShowNewProject(false)} onCreate={createProject} />
      <div className="sidebar-spacer" />
      {!projectOpen && nav === "dashboard" ? (
        <DashboardView
          projects={projectCatalog}
          onOpenProjects={() => { setNav("workspace"); setProjectOpen(false); }}
          onOpenProject={() => { if (currentProjectId) openProjectById(currentProjectId); else { setNav("workspace"); setProjectOpen(false); } }}
          onGoSettings={() => { setNav("settings"); setProjectOpen(false); }}
          onGoAgent={() => { setNav("workspace"); setProjectOpen(true); setCenterMode("ai"); }}
          aiConfig={aiConfig}
          conn={connStatus}
          activity={activity}
          agentStatus={agentStatus}
          modelLabel={modelLabel}
        />
      ) : !projectOpen && nav === "workspace" ? (
        <ProjectListView
          projects={projectCatalog}
          onOpen={(p) => openProjectById(p)}
          onCreate={() => setShowNewProject(true)}
        />
      ) : !projectOpen && nav === "settings" ? (
        <div className="flex-1 min-h-0 p-4 max-w-lg overflow-hidden flex flex-col">
          <div className="text-sm font-medium mb-3">Settings</div>
          <div className="glass rounded-2xl flex-1 min-h-0 overflow-hidden">
            <SettingsPanel config={aiConfig} conn={connStatus} onSave={saveSettings} onTest={testConnection} onReset={resetAI} testing={testingConn} />
          </div>
        </div>
      ) : nav === "tasks" ? (
        <TasksRoadmapView

      ) : (
